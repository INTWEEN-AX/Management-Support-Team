<script>
(function () {
  // 원본 HWP는 이 탭 안에서만 읽습니다. 네트워크로 보내지 않고, 변환 결과는 새 File로 만듭니다.
  var MAX = 10 * 1024 * 1024;
  var pending = Promise.resolve();

  // 변환기 메시지 → 사용자가 바로 취할 조치
  var ERRORS = [
    [/암호화|DRM/, 'ENCRYPTED', '암호·DRM이 걸린 HWP입니다.', '권한 있는 원본을 한컴오피스에서 열어 "다른 이름으로 저장 → HWPX 문서"로 저장한 뒤 올려주세요.'],
    [/배포용/, 'DISTRIBUTION', '배포용(읽기 전용) HWP는 변환할 수 없습니다.', '일반 원본이 필요합니다. 한컴오피스에서 열 수 있다면 HWPX로 저장해 올려주세요.'],
    [/HWP 5 형식이 아닙니다|HWP 3/, 'NOT_HWP5', 'HWP 5 형식이 아닙니다 (HWP 3 또는 다른 형식).', '한컴오피스에서 HWPX로 저장해 올려주세요.'],
    [/지원 범위/, 'VERSION', '지원하는 HWP 5.0~5.1 버전이 아닙니다.', '한컴오피스에서 HWPX로 저장해 올려주세요.'],
    [/10MB|0바이트/, 'SIZE', '파일 크기가 0바이트이거나 10MB를 넘습니다.', '불필요한 이미지를 줄이거나 필요한 쪽만 저장해 다시 올려주세요.'],
    [/시간/, 'TIMEOUT', '변환 시간이 30초를 넘었습니다.', '다시 시도하거나 한컴오피스에서 HWPX로 저장해 올려주세요.'],
    [/실행/, 'WORKER_BLOCKED', '이 브라우저에서 로컬 변환기를 실행하지 못했습니다.', '최신 Chrome/Edge에서 다시 열어 보거나 한컴오피스에서 HWPX로 저장해 올려주세요.'],
    [/XML|HWPX|ZIP/, 'INVALID_OUTPUT', '변환 결과가 HWPX 규격 검증을 통과하지 못했습니다.', '이 문서는 자동 변환이 어렵습니다. 한컴오피스에서 HWPX로 저장해 올려주세요.']
  ];
  function fail(message, code) {
    var hit = null;
    for (var i = 0; i < ERRORS.length; i++) if (ERRORS[i][0].test(message)) { hit = ERRORS[i]; break; }
    var err = new Error(hit ? hit[2] : (message || '변환에 실패했습니다.'));
    err.code = code || (hit ? hit[1] : 'FAILED');
    err.action = hit ? hit[3] : '한컴오피스에서 HWPX로 저장해 다시 올려주세요.';
    return err;
  }

  function runWorker(buffer, opts) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(new Blob([window.HWP_WORKER_SOURCE], { type: 'text/javascript' }));
      var worker, timer, done = false;
      function finish(error, value) {
        if (done) return; done = true;
        clearTimeout(timer);
        if (worker) worker.terminate();
        URL.revokeObjectURL(url);
        if (opts.signal) opts.signal.removeEventListener('abort', onAbort);
        error ? reject(error) : resolve(value);
      }
      function onAbort() { finish(fail('취소', 'CANCELLED')); }
      if (opts.signal) {
        if (opts.signal.aborted) return finish(fail('취소', 'CANCELLED'));
        opts.signal.addEventListener('abort', onAbort);
      }
      try {
        worker = new Worker(url);
        timer = setTimeout(function () { finish(fail('변환 시간 30초를 초과했습니다.')); }, 30000);
        worker.onerror = function () { finish(fail('브라우저 변환기를 실행하지 못했습니다.')); };
        worker.onmessage = function (event) {
          event.data.error ? finish(fail(event.data.error)) : finish(null, event.data);
        };
        worker.postMessage(buffer, [buffer]);
      } catch (error) { finish(fail('이 브라우저에서 로컬 변환을 실행할 수 없습니다. 실행')); }
    });
  }

  async function convert(file, opts) {
    var stage = opts.onStage || function () {};
    if (!file.size || file.size > MAX) throw fail('HWP는 0바이트 초과 10MB 이하만 지원합니다.');
    stage('read', '파일을 읽는 중…');
    var buffer = await file.arrayBuffer();
    stage('convert', 'HWP → HWPX 변환 중… (최대 30초)');
    var result = await runWorker(buffer, opts);
    stage('validate', '변환 결과를 검증하는 중…');
    if (!result.output || !result.xml || !result.xml.length) throw fail('변환 결과가 비어 있습니다. HWPX');
    var sections = 0, tables = 0;
    result.xml.forEach(function (xml, i) {
      if (/<!DOCTYPE|<!ENTITY/i.test(xml)) throw fail('HWPX XML 선언이 허용되지 않습니다.');
      var doc = new DOMParser().parseFromString(xml, 'application/xml');
      if (doc.getElementsByTagName('parsererror').length) throw fail('변환 HWPX XML 검증 실패');
      if (/^Contents\/section\d+\.xml$/.test((result.names || [])[i] || '')) {
        sections++;
        tables += (xml.match(/<(?:[\w.-]+:)?tbl[\s>]/g) || []).length;
      }
    });
    if (!sections) throw fail('변환 결과에 본문 구역이 없습니다. HWPX');
    var converted = new File([result.output], file.name.replace(/\.hwp$/i, '_변환.hwpx'), { type: 'application/hwp+zip' });
    // 구조 검증 결과만 알려 준다. 글꼴·여백·도형 등 레이아웃이 같다는 보장은 하지 않는다.
    converted.conversionInfo = { sections: sections, tables: tables, bytes: result.output.length };
    return converted;
  }

  // 한 번에 하나씩 변환한다 (메모리·워커 수 제한). opts: { onStage(code, text), signal }
  window.convertLegacyHwp = function (file, opts) {
    var next = pending.then(function () { return convert(file, opts || {}); });
    pending = next.catch(function () {});
    return next;
  };
})();
</script>
