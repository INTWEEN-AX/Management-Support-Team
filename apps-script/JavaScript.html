  // ── 법인카드 영수증 ──
  //
  // 카드 내역은 어차피 카드사에서 온다. 사람만 아는 건 '이 결제가 뭐였는지' 라
  // 그걸 결제 직후에 받는 데 초점을 맞춘다.
  // 읽은 값은 절대 자동 저장하지 않는다 — 금액을 잘못 읽으면 회계 사고다.

  let receiptImage = null;   // { dataBase64, mimeType, name }

  function initExpense() {

  function rcStatus(kind, text) {
    const el = document.getElementById('receipt-status');
    el.style.display = '';
    el.className = 'checklist ' + kind;
    el.innerHTML = '<span class="check-icon ' + kind + '">' +

  /**
   * 폰 사진은 3~8MB 라 그대로 올리면 전송에서만 한참 걸린다.
   * 영수증 글자를 읽는 데는 긴 변 1400px 이면 충분하다.
   * 서버로 가는 양이 20배 가까이 줄고, 비전 모델 토큰도 같이 줄어든다.
   */
  const RECEIPT_MAX_PX = 1400;

  function shrinkImage(file, done, fail) {
    const finish = function (bmpOrImg, w0, h0) {
      try {
        const scale = Math.min(1, RECEIPT_MAX_PX / Math.max(w0, h0));
        const w = Math.max(1, Math.round(w0 * scale));
        const h = Math.max(1, Math.round(h0 * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(bmpOrImg, 0, 0, w, h);
        const url = canvas.toDataURL('image/jpeg', 0.8);
        done({ dataUrl: url, base64: url.split(',')[1], w: w, h: h });
      } catch (err) { fail(err); }
    };

    // createImageBitmap 은 폰 사진의 회전 정보(EXIF)까지 반영해준다
    if (window.createImageBitmap) {
      createImageBitmap(file, { imageOrientation: 'from-image' })
        .then(function (bmp) { finish(bmp, bmp.width, bmp.height); })
        .catch(function () { viaImage(); });
    } else {
      viaImage();
    }

    function viaImage() {
      const reader = new FileReader();
      reader.onload = function () {
        const img = new Image();
        img.onload = function () { finish(img, img.naturalWidth, img.naturalHeight); };
        img.onerror = function () { fail(new Error('사진을 열지 못했습니다.')); };
        img.src = String(reader.result);
      };
      reader.onerror = function () { fail(new Error('사진을 읽지 못했습니다.')); };
      reader.readAsDataURL(file);
    }
  }

  function onReceiptPicked(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    rcStatus('warn', '사진을 줄이는 중…');
    document.getElementById('receipt-form-card').style.display = 'none';

    shrinkImage(file, function (out) {
      receiptImage = { dataBase64: out.base64, mimeType: 'image/jpeg', name: file.name };

      const img = document.getElementById('receipt-preview');
      img.src = out.dataUrl;
      img.style.display = '';

      const beforeKb = Math.round(file.size / 1024);
      const afterKb = Math.round(out.base64.length * 3 / 4 / 1024);
      const t0 = Date.now();
      rcStatus('warn', '영수증을 읽는 중… (' + beforeKb + 'KB → ' + afterKb + 'KB)');

      google.script.run
        .withSuccessHandler(function (r) {
          fillReceiptForm(r);
          if (r.amount) {
            rcStatus('ok', '읽었습니다 (' + ((Date.now() - t0) / 1000).toFixed(1) +
              '초). 금액과 날짜를 확인해주세요.');
          }
        })
        .withFailureHandler(function (err) {
          rcStatus('bad', String(err.message || err).split(String.fromCharCode(10))[0]);
          // 못 읽어도 손으로 채울 수 있게 폼은 열어준다
          fillReceiptForm({ date: '', store: '', amount: 0, card: '', confidence: 'low' });
        })
        .readReceipt(receiptImage);

    }, function (err) {
      rcStatus('bad', String(err.message || err));
    });
  }

  function fillReceiptForm(r) {
    document.getElementById('rc-date').value = r.date || todayISO();
    document.getElementById('rc-store').value = r.store || '';
    document.getElementById('rc-amount').value = r.amount || '';
    document.getElementById('rc-card').value = r.card || '';
    document.getElementById('rc-purpose').value = '';
    document.getElementById('rc-project').value = '';

    const conf = document.getElementById('receipt-conf');
    if (r.confidence === 'low') {
      conf.textContent = '흐릿하게 읽혔습니다 — 값을 꼭 확인해주세요';
      conf.className = 'step-hint warn';
    } else {
      conf.textContent = r.items ? escapeHtml(r.items) : '';
      conf.className = 'step-hint';
    }

    document.getElementById('receipt-form-card').style.display = '';
    document.getElementById('rc-purpose').focus();
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function saveReceipt() {
    const purpose = document.getElementById('rc-purpose').value.trim();
    if (!purpose) {
      toast('사유·참석자를 적어주세요. 나중에 이걸 되짚는 데 시간이 제일 많이 듭니다.');
      document.getElementById('rc-purpose').focus();
      return;
    }
    const amount = Number(document.getElementById('rc-amount').value);
    if (!amount) { toast('금액을 확인해주세요.'); return; }

    const btn = document.getElementById('rc-save');
    btn.disabled = true;
    btn.textContent = '저장 중…';

    google.script.run
      .withSuccessHandler(function () {
        btn.disabled = false;
        btn.textContent = '저장';
        toast('등록했습니다.');
        resetReceipt();
        loadRecentExpenses();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '저장';
        toast(String(err.message || err).split(String.fromCharCode(10))[0]);
      })
      .saveExpense({
        date: document.getElementById('rc-date').value,
        store: document.getElementById('rc-store').value,
        amount: amount,
        card: document.getElementById('rc-card').value,
        project: document.getElementById('rc-project').value,
        purpose: purpose,
        account: document.getElementById('rc-account').value,
        dataBase64: receiptImage ? receiptImage.dataBase64 : '',
        mimeType: receiptImage ? receiptImage.mimeType : ''
      });
  }

  function resetReceipt() {
    receiptImage = null;
    document.getElementById('receipt-file').value = '';
    document.getElementById('receipt-preview').style.display = 'none';
    document.getElementById('receipt-status').style.display = 'none';
    document.getElementById('receipt-form-card').style.display = 'none';
  }

  function loadRecentExpenses() {
    google.script.run
      .withSuccessHandler(function (info) {
        const el = document.getElementById('expense-sheet-link');
        el.innerHTML = info.ok
          ? '<a href="' + info.url + '" target="_blank" rel="noopener">시트에서 보기</a>'
          : escapeHtml(info.reason);
      })
      .getExpenseInfo();

    google.script.run
      .withSuccessHandler(renderExpenseList)
      .withFailureHandler(function (err) {
        document.getElementById('expense-list').innerHTML =
          '<div class="empty-state">' + escapeHtml(String(err.message || err)) + '</div>';
      })
      .getRecentExpenses(15);
  }

  function renderExpenseList(rows) {
    const wrap = document.getElementById('expense-list');
    if (!rows || !rows.length) {
      wrap.innerHTML = '<div class="empty-state">아직 등록된 내역이 없습니다.</div>';
      return;
    }
    wrap.innerHTML = rows.map(function (r) {
      return '<div class="ledger-row"><div class="ledger-row-main exp-cols">' +
        '<div class="ledger-main-text">' +
          '<div class="task-name">' + escapeHtml(r.store || '(상호 미기재)') + '</div>' +
          '<div class="org-name">' + escapeHtml(r.purpose || '') +
            (r.project ? ' · ' + escapeHtml(r.project) : '') + '</div>' +
        '</div>' +
        '<div class="doc-expiry"><b>' + r.amount.toLocaleString() + '원</b>' +
          '<span>' + escapeHtml(r.date) + '</span></div>' +
        (r.link ? '<a class="exp-link" href="' + r.link + '" target="_blank" rel="noopener">영수증</a>' : '<span></span>') +
      '</div></div>';
    }).join('');
  }

  // ── 표 복사 ──

  function perfTable() {
    const head = ['연번', '과업명', '발주처', '계약금액(원)', '계약기간', '용역개요'];
    const rows = ALL_RECORDS
      .filter(function (r) { return selectedPerf.has(perfKeyOf(r)); })
      .map(function (r, i) {
        return [String(i + 1), r.taskName || '', r.org || '',
          r.amount ? Number(r.amount).toLocaleString() : (r.amountRaw || ''),
          r.contractPeriod || r.contractDate || '', r.desc || ''];
      });
    return [head].concat(rows);
  }

  function hrTable() {
    const head = ['연번', '성명', '소속', '직위', '최종학력', '전공', '경력기간', '입사일'];
    const rows = ALL_HR_RECORDS
      .filter(function (r) { return selectedHR.has(r.name); })
      .map(function (r, i) {
        return [String(i + 1), r.name || '', r.dept || '', r.position || '',
          [r.eduSchool, r.eduDegree].filter(Boolean).join(' '),
          r.eduMajor || '', r.career || '', r.joinDate || ''];
      });
    return [head].concat(rows);
  }

  function tableToHtml(rows) {
    return '<table border="1" style="border-collapse:collapse">' +
      rows.map(function (row, i) {
        const tag = i === 0 ? 'th' : 'td';
        return '<tr>' + row.map(function (c) {
          return '<' + tag + ' style="padding:4px 8px">' + escapeHtml(c) + '</' + tag + '>';
        }).join('') + '</tr>';
      }).join('') + '</table>';
  }

  function tableToText(rows) {
    return rows.map(function (row) {
      return row.map(function (c) { return String(c).replace(/[\t\n]/g, ' '); }).join('\t');
    }).join('\n');
  }

  /**
   * 표를 클립보드에 넣는다.
   * text/html 로 넣어야 한글·워드에 붙였을 때 표 모양이 살아난다.
   * Apps Script 웹앱은 iframe 안이라 Clipboard API 가 막힐 수 있어,
   * 실패하면 선택+execCommand 방식으로 물러선다.
   */
  function copyTables(blocks) {
    const html = blocks.map(function (b) {
      return (b.title ? '<p><b>' + escapeHtml(b.title) + '</b></p>' : '') + tableToHtml(b.rows);
    }).join('<br>');
    const text = blocks.map(function (b) {
      return (b.title ? b.title + '\n' : '') + tableToText(b.rows);
    }).join('\n\n');

    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' })
      })]).then(function () { toast('복사했습니다. 한글 문서에 붙여넣으세요.'); },
                function () { copyFallback(html); });
      return;
    }
    copyFallback(html);
  }

  function copyFallback(html) {
    const holder = document.createElement('div');
    holder.contentEditable = 'true';
    holder.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    holder.innerHTML = html;
    document.body.appendChild(holder);

    const range = document.createRange();
    range.selectNodeContents(holder);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }

    sel.removeAllRanges();
    document.body.removeChild(holder);
    toast(ok ? '복사했습니다. 한글 문서에 붙여넣으세요.'
             : '복사에 실패했습니다. 표를 직접 선택해 복사해주세요.');
  }

  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function initProposeModal() {
    initUpload();
    [['sample-staff', 'staff'], ['sample-performance', 'performance']].forEach(function (item) {
      document.getElementById(item[0]).addEventListener('click', function () {
        const button = document.getElementById(item[0]);
        button.disabled = true;
        google.script.run
          .withSuccessHandler(function (result) {
            button.disabled = false;
            if (!downloadBase64(result.name, result.dataBase64)) {
              toast('예시 파일을 만들었지만 브라우저가 다운로드를 막았습니다.');
              return;
            }
            // 다운로드와 함께 아래 업로드 목록에도 바로 올려 클릭만으로 다음 단계를 체험하게 한다.
            handleFiles([base64ToFile(result.dataBase64, result.name, 'application/hwp+zip')]);
            toast('합성 예시 HWPX를 내려받고 업로드 목록에 추가했습니다. 가상 데이터만 포함됩니다.');
          })
          .withFailureHandler(function (error) {
            button.disabled = false;
            toast('예시 생성 실패: ' + error.message);
          })
          .getSyntheticProposalExample(item[1]);
      });
    });
    initProposal();
    document.getElementById('propose-perf-search').addEventListener('input', renderPerfList);
    document.getElementById('propose-perf-sort').addEventListener('change', renderPerfList);
    document.getElementById('propose-hr-search').addEventListener('input', renderProposePeople);
    document.getElementById('copy-perf').addEventListener('click', function () {
      if (!selectedPerf.size) return toast('선택된 실적이 없습니다.');
      copyTables([{ title: '수행실적', rows: perfTable() }]);
    });
    document.getElementById('copy-hr').addEventListener('click', function () {
      if (!selectedHR.size) return toast('선택된 인력이 없습니다.');
      copyTables([{ title: '참여인력', rows: hrTable() }]);
    });
    document.getElementById('fill-forms').addEventListener('click', generateForms);
  }
</script>
