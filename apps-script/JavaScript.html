<script>
  const FIELD_COLORS = {
    '교육': 'var(--field-edu)',
    '스타트업 지원': 'var(--field-startup)',
    '행사 기획·운영': 'var(--field-event)',
    '홍보/마케팅': 'var(--field-promo)',
    'IT 플랫폼 운영': 'var(--field-it)',
    '지역 브랜딩/상권활성화': 'var(--field-region)',
    '미분류': 'var(--field-none)',
  };
  const FIELD_ORDER = Object.keys(FIELD_COLORS);

  // 차트 크롬 — Stylesheet.html 의 라이트 토큰과 같은 값
  const CHART_FONT = 'Pretendard';
  const CHART_GRID = '#E9E9E9';    // --grey-4
  const CHART_TICK = '#555555';    // --grey-2
  const CHART_SURFACE = '#FFFFFF'; // --background (조각 사이 간격용)

  let ALL_RECORDS = [];
  let activeFieldFilter = null; // clicking legend/composition toggles this
  let fieldChart, yearChart;

  const PPT_AX_API_BASE_URL = 'http://localhost:8000';

  const STATUS_COLORS = {
    '재직(상근)': 'var(--accent)',
    '재직(비상근)': 'var(--field-edu)',
    '휴직': 'var(--field-none)',
  };
  const DEPT_COLOR_PALETTE = [
    'var(--field-edu)', 'var(--field-startup)', 'var(--field-event)',
    'var(--field-promo)', 'var(--field-it)', 'var(--field-region)',
    'var(--accent)', 'var(--field-none)',
  ];
  const TAB_SUBTITLES = {
    home: '업무 도구 모음',
    performance: '제안서 작성 참고용 · 실적증빙리스트 연동',
    hr: '조직 구성 및 인사정보 조회 · 개인정보는 상세보기에서만 노출',
    bid: '나라장터 공고 자동 수집 · 매일 오전 갱신 · 투찰은 나라장터에서 직접',
    documents: '입찰 행정서류 유효기간 관리 · D-day는 조회 시점 기준으로 재계산',
    leave: '보상휴가 잔여 및 소멸 임박 · 정본은 다우오피스, 여기는 조회용',
    expense: '법인카드 영수증 촬영 · 읽은 값은 확인 후 저장',
    propose: '공고문 분석 및 제안자료 준비 · 실적/인력 선택 후 표로 복사',
    proposal: '기술 제안서(PPT) 초안 작성 · 준비중',
  };

  let ALL_BID_RECORDS = [];
  let ALL_DOC_RECORDS = [];
  let activeDocStatus = '';

  let ALL_HR_RECORDS = [];
  let activeHRDeptFilter = null;
  let DEPT_COLORS = {};

  function resolveColor(varExpr) {
    // "var(--field-edu)" -> 실제 계산된 색상값
    const el = document.createElement('div');
    el.style.color = varExpr;
    document.body.appendChild(el);
    const rgb = getComputedStyle(el).color;
    document.body.removeChild(el);
    return rgb;
  }

  document.addEventListener('DOMContentLoaded', function () {
    initTabs();
    google.script.run.withSuccessHandler(onDataLoaded).withFailureHandler(onLoadError).getPerformanceData();
    google.script.run.withSuccessHandler(onHRDataLoaded).withFailureHandler(onHRLoadError).getHRData();
    google.script.run.withSuccessHandler(onBidDataLoaded).withFailureHandler(onBidLoadError).getBidData();
    google.script.run.withSuccessHandler(onDocDataLoaded).withFailureHandler(onDocLoadError).getDocumentData();
  });

  let currentTab = 'home';

  function initTabs() {
    // 탭 버튼, 홈으로 돌아가는 로고, 포털 카드 — data-tab 이 있으면 모두 이동 트리거
    document.querySelectorAll('[data-tab]').forEach(function (el) {
      el.addEventListener('click', function () { switchTab(el.dataset.tab); });
    });
    initHistory();
    initPortalSearch();
    initProposeModal();
    initLeave();
    initExpense();
  }

  /**
   * 탭 전환을 브라우저 히스토리에 남긴다.
   * 이게 없으면 뒤로가기가 곧바로 앱 밖으로 나가버린다.
   *
   * 웹앱은 googleusercontent.com 의 iframe 안에서 돌기 때문에 pushState 에
   * URL 을 넘기면 SecurityError 가 난다. URL 없이 state 만 쌓으면 주소는
   * 그대로면서 히스토리 항목만 생기고, 뒤로가기는 popstate 로 잡힌다.
   */
  function initHistory() {
    try {
      history.replaceState({ tab: 'home' }, '');
    } catch (e) {
      return; // 히스토리를 못 쓰는 환경이면 조용히 기존 동작 유지
    }
    window.addEventListener('popstate', function (e) {
      switchTab((e.state && e.state.tab) || 'home', true);
    });
  }

  function switchTab(tab, fromHistory) {
    if (!tab) return;
    var panel = document.getElementById('panel-' + tab);
    if (!panel) return;
    if (tab === currentTab && fromHistory) return;

    // 같은 탭을 다시 눌렀을 때 히스토리가 중복으로 쌓이지 않게 한다
    if (!fromHistory && tab !== currentTab) {
      try { history.pushState({ tab: tab }, ''); } catch (e) { /* 무시 */ }
    }
    currentTab = tab;

    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('.panel').forEach(function (p) { p.style.display = 'none'; });
    panel.style.display = '';

    // 홈은 전체화면 포털이라 서브 헤더를 숨긴다.
    // 서브 페이지에서는 body.subpage 로 배경 장식(메시/워시)을 걷어낸다.
    var isHome = (tab === 'home');
    document.body.classList.toggle('subpage', !isHome);
    document.getElementById('subhead').style.display = isHome ? 'none' : '';
    if (tab === 'leave' && !LEAVE_META) loadLeave();
    if (tab === 'expense') loadRecentExpenses();
    document.getElementById('page-subtitle').textContent = isHome ? '' : (TAB_SUBTITLES[tab] || '');
    window.scrollTo(0, 0);

    // 제안자료 페이지는 목록에서만 들어오므로 직접 진입하면 공고 목록으로 되돌린다
    if ((tab === 'propose' || tab === 'proposal') && !proposeBid) { switchTab('bid', true); return; }

    // 차트는 패널이 display:none 인 동안 0×0 으로 그려진다.
    // 탭이 보이는 시점에 다시 크기를 잡아줘야 정상 표시된다.
    if (tab === 'performance') {
      if (fieldChart) fieldChart.resize();
      if (yearChart) yearChart.resize();
    }
  }

  /** 포털 검색: 카드 흐리게 필터링 + Enter 로 첫 결과 이동 */
  function initPortalSearch() {
    var input = document.getElementById('portalSearch');
    if (!input) return;
    var cards = Array.prototype.slice.call(document.querySelectorAll('.portal-card'));

    function matches(card, q) {
      if (!q) return true;
      var hay = ((card.dataset.keywords || '') + ' ' +
                 (card.querySelector('.card-title') || {}).textContent).toLowerCase();
      return hay.indexOf(q) > -1;
    }

    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      cards.forEach(function (card) {
        card.style.opacity = matches(card, q) ? '' : '0.28';
      });
    });

    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var q = input.value.trim().toLowerCase();
      // 준비중 카드는 이동 대상에서 제외
      var hit = cards.filter(function (c) {
        return c.dataset.tab && !c.classList.contains('disabled') && matches(c, q);
      })[0];
      if (hit) switchTab(hit.dataset.tab);
    });
  }

  function onLoadError(err) {
    document.getElementById('ledger').innerHTML =
      '<div class="empty-state">데이터를 불러오지 못했습니다.<br>' + (err.message || err) + '</div>';
  }

  function onDataLoaded(records) {
    if (!records || !Array.isArray(records)) {
      onLoadError(new Error('서버 응답이 비어있습니다. Apps Script 실행 기록을 확인해주세요.'));
      return;
    }
    ALL_RECORDS = records;
    if (proposeBid) renderPerfList();   // 제안서 화면을 먼저 열었을 수 있다
    populateYearFilter(records);
    populateFieldFilter(records);
    document.getElementById('updated-at').textContent =
      new Date().toLocaleString('ko-KR', { hour12: false });

    ['search-input', 'field-select', 'year-select', 'org-input'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', renderAll);
    });
    document.getElementById('sort-select').addEventListener('change', renderAll);
    document.getElementById('reset-btn').addEventListener('click', function () {
      document.getElementById('search-input').value = '';
      document.getElementById('org-input').value = '';
      document.getElementById('field-select').value = '';
      document.getElementById('year-select').value = '';
      activeFieldFilter = null;
      renderAll();
    });

    renderAll();
  }

  function populateYearFilter(records) {
    const years = Array.from(new Set(records.map(function (r) { return r.year; })))
      .filter(Boolean)
      .sort(function (a, b) { return b - a; });
    const sel = document.getElementById('year-select');
    years.forEach(function (y) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y + '년';
      sel.appendChild(opt);
    });
  }

  function populateFieldFilter(records) {
    const sel = document.getElementById('field-select');
    FIELD_ORDER.forEach(function (f) {
      if (!records.some(function (r) { return r.field === f; })) return;
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f;
      sel.appendChild(opt);
    });
  }

  function currentFilters() {
    return {
      q: document.getElementById('search-input').value.trim().toLowerCase(),
      org: document.getElementById('org-input').value.trim().toLowerCase(),
      field: document.getElementById('field-select').value || activeFieldFilter || '',
      year: document.getElementById('year-select').value,
    };
  }

  function applyFilters(records, f) {
    return records.filter(function (r) {
      if (f.field && r.field !== f.field) return false;
      if (f.year && String(r.year) !== String(f.year)) return false;
      if (f.org && !(String(r.org).toLowerCase().indexOf(f.org) > -1)) return false;
      if (f.q) {
        const hay = (r.taskName + ' ' + r.desc + ' ' + r.org).toLowerCase();
        if (hay.indexOf(f.q) === -1) return false;
      }
      return true;
    });
  }

  function renderAll() {
    const f = currentFilters();
    // 필터 select에서 분야가 선택되면 activeFieldFilter(막대 클릭 상태)와 동기화
    if (document.getElementById('field-select').value) {
      activeFieldFilter = document.getElementById('field-select').value;
    }
    const filtered = applyFilters(ALL_RECORDS, f);

    renderStats(filtered);
    renderComposition(ALL_RECORDS, f.field); // 구성비는 항상 전체 기준, 선택 강조만 반영
    renderCharts(filtered);
    renderLedger(filtered);

    document.getElementById('result-count').innerHTML =
      '<b>' + filtered.length.toLocaleString() + '</b>건 표시 중 (전체 ' + ALL_RECORDS.length.toLocaleString() + '건)';
  }

  function renderStats(records) {
    const total = records.length;
    const amountSum = records.reduce(function (s, r) { return s + (r.amount || 0); }, 0);
    const orgSet = new Set(records.map(function (r) { return r.org; }).filter(Boolean));
    document.getElementById('stat-total').textContent = total.toLocaleString();
    document.getElementById('stat-amount').textContent = formatEok(amountSum);
    document.getElementById('stat-orgs').textContent = orgSet.size.toLocaleString();
  }

  function formatEok(won) {
    if (!won) return '0';
    const eok = won / 100000000;
    if (eok >= 1) return eok.toFixed(1) + '억';
    return Math.round(won / 10000).toLocaleString() + '만';
  }

  function renderComposition(records, selectedField) {
    const counts = {};
    FIELD_ORDER.forEach(function (f) { counts[f] = 0; });
    records.forEach(function (r) { counts[r.field] = (counts[r.field] || 0) + 1; });
    const total = records.length || 1;

    const bar = document.getElementById('composition-bar');
    const legend = document.getElementById('composition-legend');
    bar.innerHTML = '';
    legend.innerHTML = '';

    FIELD_ORDER.forEach(function (field) {
      const count = counts[field];
      if (!count) return;
      const pct = (count / total) * 100;

      const seg = document.createElement('div');
      seg.className = 'composition-seg' + (selectedField && selectedField !== field ? ' dim' : '');
      seg.style.width = pct + '%';
      seg.style.background = FIELD_COLORS[field];
      seg.title = field + ' · ' + count + '건 (' + pct.toFixed(1) + '%)';
      seg.addEventListener('click', function () { toggleFieldFilter(field); });
      bar.appendChild(seg);

      const item = document.createElement('div');
      item.className = 'item' + (selectedField === field ? ' active' : '');
      item.innerHTML =
        '<span class="swatch" style="background:' + FIELD_COLORS[field] + '"></span>' +
        field + ' ' + count + '건';
      item.addEventListener('click', function () { toggleFieldFilter(field); });
      legend.appendChild(item);
    });
  }

  function toggleFieldFilter(field) {
    const sel = document.getElementById('field-select');
    if (sel.value === field) {
      sel.value = '';
      activeFieldFilter = null;
    } else {
      sel.value = field;
      activeFieldFilter = field;
    }
    renderAll();
  }

  function renderCharts(records) {
    // 분야별 건수 도넛
    const counts = {};
    FIELD_ORDER.forEach(function (f) { counts[f] = 0; });
    records.forEach(function (r) { counts[r.field] = (counts[r.field] || 0) + 1; });
    const labels = FIELD_ORDER.filter(function (f) { return counts[f] > 0; });
    const data = labels.map(function (f) { return counts[f]; });
    const colors = labels.map(function (f) { return resolveColor(FIELD_COLORS[f]); });

    const fieldCtx = document.getElementById('field-chart').getContext('2d');
    if (fieldChart) fieldChart.destroy();
    fieldChart = new Chart(fieldCtx, {
      type: 'doughnut',
      data: {
        labels: labels,
        // 조각 사이 2px 서피스 갭 — 인접한 색이 맞붙지 않도록
        datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: CHART_SURFACE }],
      },
      options: {
        maintainAspectRatio: false,
        cutout: '62%',
        plugins: {
          legend: { display: false },
          tooltip: { titleFont: { family: CHART_FONT }, bodyFont: { family: CHART_FONT } },
        },
        onClick: function (evt, elements) {
          if (elements.length) toggleFieldFilter(labels[elements[0].index]);
        },
      },
    });

    // 연도별 계약금액 추이
    const byYear = {};
    records.forEach(function (r) {
      if (!r.year) return;
      byYear[r.year] = (byYear[r.year] || 0) + (r.amount || 0);
    });
    const years = Object.keys(byYear).sort();
    const amounts = years.map(function (y) { return Math.round(byYear[y] / 100000000 * 10) / 10; });

    const yearCtx = document.getElementById('year-chart').getContext('2d');
    if (yearChart) yearChart.destroy();
    yearChart = new Chart(yearCtx, {
      type: 'bar',
      data: {
        labels: years,
        datasets: [{
          data: amounts,
          backgroundColor: resolveColor('var(--accent)'),
          borderRadius: 4,
          maxBarThickness: 28,
        }],
      },
      options: {
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: function (ctx) { return ctx.parsed.y + '억 원'; } },
            titleFont: { family: CHART_FONT }, bodyFont: { family: CHART_FONT },
          },
        },
        scales: {
          y: {
            ticks: {
              callback: function (v) { return v + '억'; },
              font: { family: CHART_FONT, size: 11 },
              color: CHART_TICK,
            },
            grid: { color: CHART_GRID },
            border: { display: false },
          },
          x: {
            ticks: { font: { family: CHART_FONT, size: 11 }, color: CHART_TICK },
            grid: { display: false },
            border: { color: CHART_GRID },
          },
        },
      },
    });
  }

  function renderLedger(records) {
    const wrap = document.getElementById('ledger');
    wrap.innerHTML = '';

    if (!records.length) {
      wrap.innerHTML = '<div class="empty-state">조건에 맞는 실적이 없습니다. 필터를 조정해보세요.</div>';
      return;
    }

    const sortMode = document.getElementById('sort-select').value;
    const sorted = records.slice().sort(function (a, b) {
      switch (sortMode) {
        case 'year_asc':
          return (Number(a.year) || 0) - (Number(b.year) || 0) || (Number(a.no) || 0) - (Number(b.no) || 0);
        case 'amount_desc':
          return (Number(b.amount) || 0) - (Number(a.amount) || 0);
        case 'amount_asc':
          return (Number(a.amount) || 0) - (Number(b.amount) || 0);
        case 'name_asc':
          return String(a.taskName || '').localeCompare(String(b.taskName || ''), 'ko');
        case 'year_desc':
        default: {
          const yearDiff = (Number(b.year) || 0) - (Number(a.year) || 0);
          if (yearDiff !== 0) return yearDiff;
          return (Number(b.no) || 0) - (Number(a.no) || 0);
        }
      }
    });

    sorted.forEach(function (r) {
      const row = document.createElement('div');
      row.className = 'ledger-row';

      const amountText = r.amount ? (r.amount / 10000).toLocaleString() + '만원' : (r.amountRaw || '-');
      const consortiumBadge = r.isConsortium
        ? '<span class="consortium-badge">컨소시엄 · 지분 ' + r.sharePct + '%</span>'
        : '';

      row.innerHTML =
        '<div class="ledger-row-main">' +
          '<div class="field-tag-bar" style="background:' + (FIELD_COLORS[r.field] || FIELD_COLORS['미분류']) + '"></div>' +
          '<div class="ledger-year">' + (r.year || '-') + '</div>' +
          '<div class="ledger-main-text">' +
            '<div class="task-name">' + escapeHtml(r.taskName) + consortiumBadge + '</div>' +
            '<div class="org-name">' + escapeHtml(r.org || '') + '</div>' +
          '</div>' +
          '<div class="field-tag"><span class="dot" style="background:' + (FIELD_COLORS[r.field] || FIELD_COLORS['미분류']) + '"></span>' + escapeHtml(r.field) + '</div>' +
          '<div class="ledger-amount">' + amountText + '</div>' +
          '<div class="expand-caret">▶</div>' +
        '</div>' +
        '<div class="ledger-detail">' +
          escapeHtml(r.desc || '용역 개요 정보 없음') +
          '<div class="detail-grid">' +
            '<div><b>계약일자</b>' + escapeHtml(r.contractDate || '-') + '</div>' +
            '<div><b>계약기간</b>' + escapeHtml(r.contractPeriod || '-') + '</div>' +
            '<div><b>사업부서</b>' + escapeHtml(r.dept || '-') + '</div>' +
            '<div><b>실적증명 상태</b>' + escapeHtml(r.status || '-') + '</div>' +
            (r.isConsortium
              ? '<div><b>전체계약금액</b>' + (r.totalAmount ? (r.totalAmount / 10000).toLocaleString() + '만원' : '-') + ' (지분 ' + r.sharePct + '%)</div>'
              : '') +
          '</div>' +
        '</div>';

      row.querySelector('.ledger-row-main').addEventListener('click', function () {
        row.classList.toggle('open');
      });

      wrap.appendChild(row);
    });
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ================= 인력현황 =================

  function onHRLoadError(err) {
    document.getElementById('hr-list').innerHTML =
      '<div class="empty-state">인력 데이터를 불러오지 못했습니다.<br>' + (err.message || err) + '</div>';
  }

  function onHRDataLoaded(records) {
    if (!records || !Array.isArray(records)) {
      onHRLoadError(new Error('서버 응답이 비어있습니다. Apps Script 실행 기록을 확인해주세요.'));
      return;
    }
    ALL_HR_RECORDS = records;
    if (proposeBid) renderProposePeople();
    assignDeptColors(records);
    populateHRDeptFilter(records);

    document.getElementById('hr-search-input').addEventListener('input', renderHRAll);
    document.getElementById('hr-dept-select').addEventListener('change', renderHRAll);
    document.getElementById('hr-status-select').addEventListener('change', renderHRAll);
    document.getElementById('hr-sort-select').addEventListener('change', renderHRAll);
    document.getElementById('hr-reset-btn').addEventListener('click', function () {
      document.getElementById('hr-search-input').value = '';
      document.getElementById('hr-dept-select').value = '';
      document.getElementById('hr-status-select').value = '';
      document.getElementById('hr-sort-select').value = 'dept_asc';
      activeHRDeptFilter = null;
      renderHRAll();
    });

    renderHRAll();
  }

  function assignDeptColors(records) {
    const depts = Array.from(new Set(records.map(function (r) { return r.dept; })))
      .filter(Boolean)
      .sort(function (a, b) { return a.localeCompare(b, 'ko'); });
    DEPT_COLORS = {};
    depts.forEach(function (d, i) { DEPT_COLORS[d] = DEPT_COLOR_PALETTE[i % DEPT_COLOR_PALETTE.length]; });
  }

  function populateHRDeptFilter(records) {
    const sel = document.getElementById('hr-dept-select');
    Object.keys(DEPT_COLORS).forEach(function (d) {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    });
  }

  function currentHRFilters() {
    return {
      q: document.getElementById('hr-search-input').value.trim().toLowerCase(),
      dept: document.getElementById('hr-dept-select').value || activeHRDeptFilter || '',
      status: document.getElementById('hr-status-select').value,
    };
  }

  function applyHRFilters(records, f) {
    return records.filter(function (r) {
      if (f.dept && r.dept !== f.dept) return false;
      if (f.status && r.status !== f.status) return false;
      if (f.q && String(r.name || '').toLowerCase().indexOf(f.q) === -1) return false;
      return true;
    });
  }

  function renderHRAll() {
    const f = currentHRFilters();
    if (document.getElementById('hr-dept-select').value) {
      activeHRDeptFilter = document.getElementById('hr-dept-select').value;
    }
    const filtered = applyHRFilters(ALL_HR_RECORDS, f);

    renderHRStats(filtered);
    renderHRDeptComposition(ALL_HR_RECORDS, f.dept);
    renderHRList(filtered);

    document.getElementById('hr-result-count').innerHTML =
      '<b>' + filtered.length.toLocaleString() + '</b>명 표시 중 (전체 ' + ALL_HR_RECORDS.length.toLocaleString() + '명)';
  }

  function renderHRStats(records) {
    const counts = { '재직(상근)': 0, '재직(비상근)': 0, '휴직': 0 };
    records.forEach(function (r) { if (counts[r.status] !== undefined) counts[r.status]++; });
    document.getElementById('hr-stat-total').textContent = records.length.toLocaleString();
    document.getElementById('hr-stat-fulltime').textContent = counts['재직(상근)'].toLocaleString();
    document.getElementById('hr-stat-parttime').textContent = counts['재직(비상근)'].toLocaleString();
    document.getElementById('hr-stat-leave').textContent = counts['휴직'].toLocaleString();
  }

  function renderHRDeptComposition(records, selectedDept) {
    const depts = Object.keys(DEPT_COLORS);
    const counts = {};
    depts.forEach(function (d) { counts[d] = 0; });
    records.forEach(function (r) { if (r.dept) counts[r.dept] = (counts[r.dept] || 0) + 1; });
    const total = records.length || 1;

    const bar = document.getElementById('hr-dept-bar');
    const legend = document.getElementById('hr-dept-legend');
    bar.innerHTML = '';
    legend.innerHTML = '';

    depts.forEach(function (dept) {
      const count = counts[dept];
      if (!count) return;
      const pct = (count / total) * 100;

      const seg = document.createElement('div');
      seg.className = 'composition-seg' + (selectedDept && selectedDept !== dept ? ' dim' : '');
      seg.style.width = pct + '%';
      seg.style.background = DEPT_COLORS[dept];
      seg.title = dept + ' · ' + count + '명 (' + pct.toFixed(1) + '%)';
      seg.addEventListener('click', function () { toggleHRDeptFilter(dept); });
      bar.appendChild(seg);

      const item = document.createElement('div');
      item.className = 'item' + (selectedDept === dept ? ' active' : '');
      item.innerHTML =
        '<span class="swatch" style="background:' + DEPT_COLORS[dept] + '"></span>' +
        dept + ' ' + count + '명';
      item.addEventListener('click', function () { toggleHRDeptFilter(dept); });
      legend.appendChild(item);
    });
  }

  function toggleHRDeptFilter(dept) {
    const sel = document.getElementById('hr-dept-select');
    if (sel.value === dept) {
      sel.value = '';
      activeHRDeptFilter = null;
    } else {
      sel.value = dept;
      activeHRDeptFilter = dept;
    }
    renderHRAll();
  }

  /**
   * 입사일을 정렬용 숫자로. 파싱 실패하면 null.
   * 시트 값이 Date 면 'yyyy-MM-dd' 로 넘어오지만, 텍스트로 적혀 있으면
   * '2026. 03. 16' 처럼 오기도 해서 구분자를 가리지 않고 읽는다.
   */
  function hrJoinTime(r) {
    const m = String(r.joinDate || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d.getTime();
  }

  function renderHRList(records) {
    const wrap = document.getElementById('hr-list');
    wrap.innerHTML = '';

    if (!records.length) {
      wrap.innerHTML = '<div class="empty-state">조건에 맞는 인원이 없습니다. 필터를 조정해보세요.</div>';
      return;
    }

    const sortMode = document.getElementById('hr-sort-select').value;
    const byName = function (a, b) {
      return String(a.name || '').localeCompare(String(b.name || ''), 'ko');
    };

    const sorted = records.slice().sort(function (a, b) {
      switch (sortMode) {
        case 'join_asc':
        case 'join_desc': {
          // 입사일이 비어 있는 인원은 정렬 방향과 무관하게 항상 맨 아래로
          const ta = hrJoinTime(a), tb = hrJoinTime(b);
          if (ta === null && tb === null) return byName(a, b);
          if (ta === null) return 1;
          if (tb === null) return -1;
          if (ta !== tb) return sortMode === 'join_asc' ? ta - tb : tb - ta;
          return byName(a, b);
        }
        case 'name_asc':
          return byName(a, b);
        case 'dept_asc':
        default:
          return String(a.dept || '').localeCompare(String(b.dept || ''), 'ko') || byName(a, b);
      }
    });

    sorted.forEach(function (r) {
      const row = document.createElement('div');
      row.className = 'ledger-row';

      const statusColor = STATUS_COLORS[r.status] || 'var(--field-none)';
      const eduLine = [r.eduSchool, r.eduMajor, r.eduDegree].filter(Boolean).join(' ') +
        (r.eduGradYm ? ' (' + r.eduGradYm + ' 졸업)' : '');

      row.innerHTML =
        '<div class="ledger-row-main hr-cols">' +
          '<div class="field-tag-bar" style="background:' + statusColor + '"></div>' +
          '<div class="ledger-main-text">' +
            '<div class="task-name">' + escapeHtml(r.name) + '</div>' +
            '<div class="org-name">' + escapeHtml(r.dept || '') + '</div>' +
          '</div>' +
          '<div class="field-tag">' + escapeHtml(r.position || '-') + '</div>' +
          '<div class="hr-tenure">' +
            escapeHtml(r.career || '-') +
            (r.joinDate ? '<span>' + escapeHtml(r.joinDate) + ' 입사</span>' : '') +
          '</div>' +
          '<div class="field-tag"><span class="dot" style="background:' + statusColor + '"></span>' + escapeHtml(r.status) + '</div>' +
          '<div class="expand-caret">▶</div>' +
        '</div>' +
        '<div class="ledger-detail">' +
          '<div class="detail-grid">' +
            '<div><b>생년월일</b>' + escapeHtml(r.birthDate || '-') + '</div>' +
            '<div><b>최종학력</b>' + escapeHtml(eduLine.trim() || '-') + '</div>' +
            '<div><b>집주소</b>' + escapeHtml(r.address || '-') + '</div>' +
            '<div><b>이메일 주소</b>' + escapeHtml(r.email || '-') + '</div>' +
            '<div><b>전화번호</b>' + escapeHtml(r.phone || '-') + '</div>' +
            '<div><b>인트윈 입사년월일</b>' + escapeHtml(r.joinDate || '-') + '</div>' +
          '</div>' +
        '</div>';

      row.querySelector('.ledger-row-main').addEventListener('click', function () {
        row.classList.toggle('open');
      });

      wrap.appendChild(row);
    });
  }

  // ================= 입찰공고 =================

  function onBidLoadError(err) {
    document.getElementById('bid-list').innerHTML =
      '<div class="empty-state">입찰공고를 불러오지 못했습니다.<br>' + escapeHtml(err.message || err) +
      '<br><br>스프레드시트 메뉴 [입찰공고] → [설정] 에서 인증키를 등록했는지 확인해주세요.</div>';
  }

  function onBidDataLoaded(records) {
    if (!records || !Array.isArray(records)) {
      onBidLoadError(new Error('서버 응답이 비어있습니다.'));
      return;
    }
    ALL_BID_RECORDS = records;
    populateBidKindFilter(records);

    ['bid-search-input', 'bid-kind-select', 'bid-status-select', 'bid-sort-select']
      .forEach(function (id) {
        const el = document.getElementById(id);
        el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', renderBidAll);
      });

    document.getElementById('bid-reset-btn').addEventListener('click', function () {
      document.getElementById('bid-search-input').value = '';
      document.getElementById('bid-kind-select').value = '';
      document.getElementById('bid-status-select').value = 'open';
      document.getElementById('bid-sort-select').value = 'close_asc';
      renderBidAll();
    });

    renderBidAll();
  }

  function populateBidKindFilter(records) {
    const sel = document.getElementById('bid-kind-select');
    Array.from(new Set(records.map(function (r) { return r.kind; })))
      .filter(Boolean)
      .sort(function (a, b) { return a.localeCompare(b, 'ko'); })
      .forEach(function (k) {
        const o = document.createElement('option');
        o.value = k;
        o.textContent = k;
        sel.appendChild(o);
      });
  }

  /** '2026-08-31 18:00' → Date (파싱 실패 시 null) */
  function parseBidDate(s) {
    const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 23), +(m[5] || 59));
  }

  /** 마감까지 남은 일수 (마감일 없으면 null, 이미 지났으면 음수) */
  function daysToClose(r) {
    const d = parseBidDate(r.closeDt);
    if (!d) return null;
    return Math.ceil((d.getTime() - Date.now()) / 86400000);
  }

  function currentBidFilters() {
    return {
      q: document.getElementById('bid-search-input').value.trim().toLowerCase(),
      kind: document.getElementById('bid-kind-select').value,
      status: document.getElementById('bid-status-select').value,
    };
  }

  function applyBidFilters(records, f) {
    return records.filter(function (r) {
      if (f.kind && r.kind !== f.kind) return false;

      if (f.status) {
        const d = daysToClose(r);
        // 마감일을 못 읽은 공고는 숨기지 않는다 (놓치는 것보다 낫다)
        if (d !== null) {
          if (f.status === 'open' && d < 0) return false;
          if (f.status === 'urgent' && (d < 0 || d > 3)) return false;
        }
      }

      if (f.q) {
        const hay = (r.name + ' ' + r.noticeOrg + ' ' + r.demandOrg + ' ' + r.keywords).toLowerCase();
        if (hay.indexOf(f.q) === -1) return false;
      }
      return true;
    });
  }

  function renderBidAll() {
    const f = currentBidFilters();
    const filtered = applyBidFilters(ALL_BID_RECORDS, f);
    renderBidStats(filtered);
    renderBidList(filtered);
    document.getElementById('bid-result-count').textContent =
      filtered.length + '건 / 전체 ' + ALL_BID_RECORDS.length + '건';
  }

  function renderBidStats(records) {
    const urgent = records.filter(function (r) {
      const d = daysToClose(r);
      return d !== null && d >= 0 && d <= 3;
    }).length;
    const budgetSum = records.reduce(function (s, r) { return s + (r.budget || 0); }, 0);
    const latest = ALL_BID_RECORDS.reduce(function (m, r) {
      return (r.collectedAt && r.collectedAt > m) ? r.collectedAt : m;
    }, '');

    document.getElementById('bid-stat-total').textContent = records.length.toLocaleString();
    document.getElementById('bid-stat-urgent').textContent = urgent.toLocaleString();
    document.getElementById('bid-stat-budget').textContent = budgetSum ? formatEok(budgetSum) : '–';
    document.getElementById('bid-stat-collected').textContent = latest ? latest.slice(5) : '–';
  }

  function renderBidList(records) {
    const wrap = document.getElementById('bid-list');
    wrap.innerHTML = '';

    if (!records.length) {
      wrap.innerHTML = ALL_BID_RECORDS.length
        ? '<div class="empty-state">조건에 맞는 공고가 없습니다. 필터를 조정해보세요.</div>'
        : '<div class="empty-state">아직 수집된 공고가 없습니다.<br>' +
          '스프레드시트 메뉴 [입찰공고] → [지금 수집 실행] 을 한 번 눌러주세요.</div>';
      return;
    }

    const sortMode = document.getElementById('bid-sort-select').value;
    const sorted = records.slice().sort(function (a, b) {
      switch (sortMode) {
        case 'notice_desc':
          return String(b.noticeDt || '').localeCompare(String(a.noticeDt || ''));
        case 'budget_desc':
          return (Number(b.budget) || 0) - (Number(a.budget) || 0);
        case 'close_asc':
        default: {
          // 마감일 없는 건은 항상 뒤로
          const da = daysToClose(a), db = daysToClose(b);
          if (da === null && db === null) return 0;
          if (da === null) return 1;
          if (db === null) return -1;
          return da - db;
        }
      }
    });

    sorted.forEach(function (r) {
      const row = document.createElement('div');
      row.className = 'ledger-row';

      const d = daysToClose(r);
      let ddayText, ddayClass;
      if (d === null)      { ddayText = '–';        ddayClass = 'dday-none'; }
      else if (d < 0)      { ddayText = '마감';      ddayClass = 'dday-closed'; }
      else if (d === 0)    { ddayText = 'D-DAY';    ddayClass = 'dday-urgent'; }
      else if (d <= 3)     { ddayText = 'D-' + d;   ddayClass = 'dday-urgent'; }
      else if (d <= 7)     { ddayText = 'D-' + d;   ddayClass = 'dday-soon'; }
      else                 { ddayText = 'D-' + d;   ddayClass = 'dday-far'; }

      const budgetText = r.budget ? Math.round(r.budget / 10000).toLocaleString() + '만원' : '-';
      const tags = String(r.keywords || '').split(/\s+/).filter(Boolean)
        .map(function (k) { return '<span class="bid-kw">' + escapeHtml(k) + '</span>'; })
        .join('');

      row.innerHTML =
        '<div class="ledger-row-main bid-cols">' +
          '<div class="dday ' + ddayClass + '">' + ddayText + '</div>' +
          '<div class="ledger-main-text">' +
            '<div class="task-name">' + escapeHtml(r.name) + '</div>' +
            '<div class="org-name">' + escapeHtml(r.noticeOrg || r.demandOrg || '') +
              (r.kind ? ' · ' + escapeHtml(r.kind) : '') + '</div>' +
          '</div>' +
          '<div class="bid-kw-wrap">' + tags + '</div>' +
          '<div class="ledger-amount">' + budgetText + '</div>' +
          '<div class="expand-caret">▶</div>' +
        '</div>' +
        '<div class="ledger-detail">' +
          '<div class="detail-grid">' +
            '<div><b>공고번호</b>' + escapeHtml(r.no + (r.ord ? '-' + r.ord : '')) + '</div>' +
            '<div><b>수요기관</b>' + escapeHtml(r.demandOrg || '-') + '</div>' +
            '<div><b>계약방법</b>' + escapeHtml(r.method || '-') + '</div>' +
            '<div><b>입찰방식</b>' + escapeHtml(r.bidMethod || '-') + '</div>' +
            '<div><b>공고일시</b>' + escapeHtml(r.noticeDt || '-') + '</div>' +
            '<div><b>마감일시</b>' + escapeHtml(r.closeDt || '-') + '</div>' +
            '<div><b>개찰일시</b>' + escapeHtml(r.openDt || '-') + '</div>' +
            '<div><b>추정가격</b>' + (r.estimate ? Math.round(r.estimate / 10000).toLocaleString() + '만원' : '-') + '</div>' +
          '</div>' +
          '<div class="bid-actions">' +
            (r.url
              ? '<a class="bid-link" href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">나라장터에서 공고 원문 보기 →</a>'
              : '') +
            '<button type="button" class="btn-primary propose-open"' +
              ' data-no="' + escapeHtml(r.no) + '" data-ord="' + escapeHtml(r.ord) + '">제안자료 만들기</button>' +
          '</div>' +
        '</div>';

      row.querySelector('.propose-open').addEventListener('click', function (e) {
        e.stopPropagation();
        openPropose(r);
      });

      row.querySelector('.ledger-row-main').addEventListener('click', function () {
        row.classList.toggle('open');
      });

      wrap.appendChild(row);
    });
  }

  // ================= 입찰서류 =================

  const DOC_STATUS_LABEL = {
    expired:  '만료',
    imminent: '임박',
    normal:   '정상',
    none:     '유효기간 없음',
  };

  function onDocLoadError(err) {
    document.getElementById('doc-list').innerHTML =
      '<div class="empty-state">입찰서류를 불러오지 못했습니다.<br>' + escapeHtml(err.message || err) + '</div>';
    document.getElementById('doc-summary').innerHTML = '';
  }

  function onDocDataLoaded(records) {
    if (!records || !Array.isArray(records)) {
      onDocLoadError(new Error('서버 응답이 비어있습니다.'));
      return;
    }
    ALL_DOC_RECORDS = records;

    document.getElementById('doc-search-input').addEventListener('input', renderDocAll);

    document.getElementById('doc-status-group').addEventListener('click', function (e) {
      const btn = e.target.closest('.seg-btn');
      if (!btn) return;
      setDocStatusFilter(btn.dataset.status);
    });

    document.getElementById('doc-reset-btn').addEventListener('click', function () {
      document.getElementById('doc-search-input').value = '';
      setDocStatusFilter('');
    });

    renderDocAll();
  }

  function setDocStatusFilter(status) {
    activeDocStatus = status || '';
    document.querySelectorAll('#doc-status-group .seg-btn').forEach(function (b) {
      b.classList.toggle('active', (b.dataset.status || '') === activeDocStatus);
    });
    renderDocAll();
  }

  function renderDocAll() {
    const q = document.getElementById('doc-search-input').value.trim().toLowerCase();

    const filtered = ALL_DOC_RECORDS.filter(function (r) {
      if (activeDocStatus && r.status !== activeDocStatus) return false;
      if (q) {
        const hay = (r.name + ' ' + r.org + ' ' + r.note).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    renderDocSummary();
    renderDocList(filtered);
    document.getElementById('doc-result-count').textContent =
      filtered.length + '건 / 전체 ' + ALL_DOC_RECORDS.length + '건';
  }

  /** 상단 요약 — 재발급이 필요한 건이 있을 때만 경고로 노출 */
  function renderDocSummary() {
    const wrap = document.getElementById('doc-summary');
    const expired = ALL_DOC_RECORDS.filter(function (r) { return r.status === 'expired'; }).length;
    const imminent = ALL_DOC_RECORDS.filter(function (r) { return r.status === 'imminent'; }).length;

    if (!expired && !imminent) {
      wrap.className = 'doc-summary ok';
      wrap.innerHTML =
        '<span class="doc-summary-icon">✓</span>' +
        '<span class="doc-summary-text">재발급 필요 서류 없음</span>';
      return;
    }

    wrap.className = 'doc-summary alert';
    let chips = '';
    if (expired) {
      chips += '<button type="button" class="doc-chip expired" data-status="expired">' +
               '만료 <b>' + expired + '</b>건</button>';
    }
    if (imminent) {
      chips += '<button type="button" class="doc-chip imminent" data-status="imminent">' +
               '임박 <b>' + imminent + '</b>건</button>';
    }
    wrap.innerHTML =
      '<span class="doc-summary-icon">!</span>' +
      '<span class="doc-summary-text">재발급이 필요한 서류가 있습니다</span>' +
      '<span class="doc-chips">' + chips + '</span>';

    wrap.querySelectorAll('.doc-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        // 이미 그 상태로 보고 있으면 해제 (토글)
        setDocStatusFilter(activeDocStatus === chip.dataset.status ? '' : chip.dataset.status);
      });
    });
  }

  function renderDocList(records) {
    const wrap = document.getElementById('doc-list');
    wrap.innerHTML = '';

    if (!records.length) {
      wrap.innerHTML = ALL_DOC_RECORDS.length
        ? '<div class="empty-state">조건에 맞는 서류가 없습니다.</div>'
        : '<div class="empty-state">등록된 서류가 없습니다.<br>' +
          '경영기획실DB의 <b>입찰행정서류</b> 탭을 확인해주세요.</div>';
      return;
    }

    // 임박 순 — 유효기간 없는 서류는 항상 맨 아래
    const sorted = records.slice().sort(function (a, b) {
      if (a.dday === null && b.dday === null) return a.name.localeCompare(b.name, 'ko');
      if (a.dday === null) return 1;
      if (b.dday === null) return -1;
      return a.dday - b.dday;
    });

    sorted.forEach(function (r) {
      const row = document.createElement('div');
      row.className = 'ledger-row';

      let ddayText;
      if (r.dday === null)   ddayText = '–';
      else if (r.dday < 0)   ddayText = '+' + (-r.dday);
      else if (r.dday === 0) ddayText = 'D-DAY';
      else                   ddayText = 'D-' + r.dday;

      const checkMark = r.needsCheck
        ? '<span class="doc-check" title="비고에 확인필요 표시가 있습니다">확인필요</span>'
        : '';

      row.innerHTML =
        '<div class="ledger-row-main doc-cols">' +
          '<div class="dday doc-' + r.status + '">' + ddayText + '</div>' +
          '<div class="ledger-main-text">' +
            '<div class="task-name">' + escapeHtml(r.name) + checkMark + '</div>' +
            '<div class="org-name">' + escapeHtml(r.org || '발급기관 미기재') + '</div>' +
          '</div>' +
          '<div class="doc-expiry">' +
            (r.expiryDate
              ? '<b>' + escapeHtml(r.expiryDate) + '</b><span>까지</span>'
              : '<span>유효기간 없음</span>') +
          '</div>' +
          '<div class="doc-badge doc-' + r.status + '">' + DOC_STATUS_LABEL[r.status] + '</div>' +
          '<div class="expand-caret">▶</div>' +
        '</div>' +
        '<div class="ledger-detail">' +
          '<div class="detail-grid">' +
            '<div><b>발급기관</b>' + escapeHtml(r.org || '-') + '</div>' +
            '<div><b>발급일</b>' + escapeHtml(r.issuedDate || '-') + '</div>' +
            '<div><b>유효기간</b>' + escapeHtml(r.expiryDate || '없음') + '</div>' +
            '<div><b>남은 기간</b>' + docRemainText(r) + '</div>' +
          '</div>' +
          (r.note ? '<div class="doc-note">' + escapeHtml(r.note) + '</div>' : '') +
          (r.url
            ? '<div class="doc-actions">' +
                '<a class="bid-link" href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">문서 열기 →</a>' +
                (r.fileId
                  ? '<a class="doc-download" href="https://drive.google.com/uc?export=download&id=' +
                    escapeHtml(r.fileId) + '" target="_blank" rel="noopener">내려받기</a>'
                  : '') +
              '</div>'
            : '<div class="doc-note">드라이브 링크가 등록되어 있지 않습니다.</div>') +
        '</div>';

      row.querySelector('.ledger-row-main').addEventListener('click', function (e) {
        // 서류명을 눌렀을 때는 상세를 여는 대신 파일을 새 탭으로 연다
        if (e.target.closest('.task-name') && r.url) {
          window.open(r.url, '_blank', 'noopener');
          return;
        }
        row.classList.toggle('open');
      });

      wrap.appendChild(row);
    });
  }

  function docRemainText(r) {
    if (r.dday === null) return '-';
    if (r.dday < 0) return '만료 ' + (-r.dday) + '일 지남';
    if (r.dday === 0) return '오늘 만료';
    return r.dday + '일';
  }

  // ================= 제안자료 만들기 =================

  let proposeBid = null;
  let proposeGen = 0;
  let proposePerfList = [];
  let uploadedDocs = [];            // 브라우저 메모리에만 있는 올린 파일
  let proposePack = null;           // 자료·서식 묶음
  let briefText = '';
  let rfpForms = [];
  let rfpQualifications = [];
  const selectedPerf = new Set();
  const selectedHR = new Set();

  function openPropose(bid) {
    proposeBid = bid;
    proposeGen++;
    proposePerfList = [];
    uploadedDocs = [];
    proposePack = null;
    briefText = '';
    rfpForms = [];
    rfpQualifications = [];
    selectedPerf.clear();
    selectedHR.clear();

    switchTab('propose');

    document.getElementById('propose-bid-name').textContent = bid.name;
    document.getElementById('propose-bid-meta').textContent =
      [bid.noticeOrg,
       bid.demandOrg && bid.demandOrg !== bid.noticeOrg ? '수요 ' + bid.demandOrg : '',
       bid.kind, bid.method,
       bid.budget ? '예산 ' + Math.round(bid.budget / 10000).toLocaleString() + '만원' : '',
       bid.closeDt ? '마감 ' + bid.closeDt : '']
      .filter(Boolean).join(' · ');

    const src = document.getElementById('propose-source');
    if (bid.url) { src.href = bid.url; src.style.display = ''; }
    else { src.style.display = 'none'; }

    // 결과는 [분석 실행] 을 눌러야 나온다 — 공고를 열자마자 공고문을 읽지 않는다
    document.getElementById('upload-log').innerHTML = '';
    document.getElementById('notice-list').innerHTML =
      '<div class="attach-empty">확인하는 중…</div>';
    document.getElementById('notice-actions').innerHTML = '';
    document.getElementById('notice-hint').textContent = '';
    document.getElementById('step-qual').style.display = 'none';
    document.getElementById('step-forms').style.display = 'none';
    document.getElementById('rfp-status').style.display = 'none';

    // 앞 공고에서 만든 결과 카드를 지운다 — 안 지우면 다른 공고에 그대로 남는다
    document.querySelectorAll('.gen-result').forEach(function (el) { el.remove(); });
    const fillBtn = document.getElementById('fill-forms');
    fillBtn.textContent = '서식 자동작성';
    fillBtn.className = 'btn-primary';
    document.getElementById('go-proposal').style.display = 'none';
    rfpBodyText = '';
    document.getElementById('qual-list').innerHTML = '';
    document.getElementById('form-index').innerHTML = '';
    renderPerfList();
    renderProposePeople();
    renderProposeSelected();

    loadPack();
  }

  // ── 1~3단계: 자료 · RFP · 서식 목차 ──

  function loadPack() {
    const gen = proposeGen;
    google.script.run
      .withSuccessHandler(function (res) {
        if (gen !== proposeGen) return;
        proposePack = res;
        renderPack(res);
      })
      .withFailureHandler(function (err) {
        if (gen !== proposeGen) return;
        document.getElementById('notice-list').innerHTML =
          '<div class="attach-empty">자료를 불러오지 못했습니다.<br>' +
          escapeHtml(err.message || err) + '</div>';
      })
      .getProposalPack(proposeBid.no, proposeBid.ord);
  }

  const EXT_ICON = { hwpx: '\u25C6', pdf: '\u25A3', hwp: '\u25C7', zip: '\u25A4' };

  function renderPack(res) {
    // 나라장터 첨부는 '뭐가 있는지' 만 보여준다. 파일은 받지 않는다.
    const notice = res.notice || [];
    document.getElementById('notice-hint').textContent =
      notice.length ? notice.length + '건' : '';

    document.getElementById('notice-list').innerHTML = notice.length
      ? notice.map(function (f) {
          const cls = f.ext === 'hwp' ? 'unreadable' : 'excluded';
          const name = f.url
            ? '<a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">' + escapeHtml(f.name) + '</a>'
            : escapeHtml(f.name);
          return '<div class="attach-row ' + cls + '">' +
            '<span class="attach-icon">' + (EXT_ICON[f.ext] || '▪') + '</span>' +
            '<span class="attach-name">' + name + '</span>' +
            '<span class="attach-note">' + escapeHtml(f.kindLabel) + '</span>' +
          '</div>';
        }).join('')
      : '<div class="attach-empty">아직 가져오지 않았습니다.</div>';

    document.getElementById('attach-folder').style.display = 'none';

    const acts = document.getElementById('notice-actions');
    acts.innerHTML = '';
    if (!res.noticeFromSheet) {
      addAction(acts, 'btn-primary', '나라장터에서 첨부 목록 가져오기', refreshNotice);
    } else {
      addAction(acts, 'btn-ghost', '목록 새로고침', loadPack);
    }

    renderUploadList();
  }

  /**
   * 올린 파일 목록.
   * 파일은 브라우저 메모리에만 있다 — 드라이브에 저장하지 않는다.
   * 새로고침하면 사라지므로, 그 자리에서 읽고 채우고 내려받는 흐름이다.
   */
  function renderUploadList() {
    const status = document.getElementById('rfp-status');
    status.style.display = '';
    status.innerHTML = '';

    if (!uploadedDocs.length) {
      status.className = 'checklist warn';
      status.innerHTML = '<span class="check-icon warn">!</span>' +
        '<span>제안요청서를 올려야 서식을 채울 수 있습니다.</span>';
      return;
    }

    const fillable = uploadedDocs.filter(function (u) { return u.fillable; }).length;
    status.className = 'checklist ok';
    status.innerHTML =
      '<span class="check-icon ok">✓</span>' +
      '<span>올린 문서 ' + uploadedDocs.length + '건 · 채울 수 있는 hwpx ' + fillable + '건<br>' +
      '<span class="upload-hint">서식이 들어 있는 문서만 체크하세요. ' +
      '공고문·안내문은 채울 표가 없어 빈 결과물만 생깁니다.</span></span>';

    const list = document.createElement('div');
    list.className = 'target-list';
    list.innerHTML = uploadedDocs.map(function (u, i) {
      const size = (u.size / 1024).toFixed(0) + 'KB';
      const del = '<button type="button" class="target-del" data-del="' + i + '" ' +
                  'title="목록에서 빼기" aria-label="빼기">✕</button>';
      if (!u.fillable) {
        return '<div class="target-row readonly">' +
          '<span class="target-mark">읽기만</span>' +
          '<span class="target-name">' + escapeHtml(u.name) + '</span>' +
          '<span class="target-size">' + size + '</span>' + del +
        '</div>';
      }
      return '<label class="target-row">' +
        '<input type="checkbox" data-idx="' + i + '"' + (u.checked ? ' checked' : '') + '>' +
        '<span class="target-name">' + escapeHtml(u.name) + '</span>' +
        '<span class="target-size">' + size + '</span>' + del +
      '</label>';
    }).join('');
    status.appendChild(list);

    list.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        uploadedDocs[Number(cb.dataset.idx)].checked = cb.checked;
        renderProposeSelected();
      });
    });

    list.querySelectorAll('.target-del').forEach(function (b) {
      b.addEventListener('click', function (e) {
        // 행 전체가 label 이라 막지 않으면 체크박스가 같이 토글된다
        e.preventDefault();
        e.stopPropagation();
        removeUpload(Number(b.dataset.del));
      });
    });

    const box = document.createElement('div');
    box.className = 'forms-actions';
    addAction(box, 'btn-ghost', '공고문에서 서식·참가자격 읽기', readDocs);
    addAction(box, 'btn-ghost', '올린 파일 비우기', function () {
      uploadedDocs = [];
      document.getElementById('upload-log').innerHTML = '';
      document.getElementById('step-qual').style.display = 'none';
      document.getElementById('step-forms').style.display = 'none';
      renderUploadList();
      renderProposeSelected();
    });
    status.appendChild(box);
  }

  /** 목록에서 파일 하나를 뺀다 (브라우저 메모리에서만 지우면 된다) */
  function removeUpload(i) {
    const gone = uploadedDocs[i];
    if (!gone) return;
    uploadedDocs.splice(i, 1);
    clearUploadLog(gone.name);
    renderUploadList();
    renderProposeSelected();
  }

  function uploadLogId(name) {
    return 'up_' + name.replace(/[^a-zA-Z0-9]/g, '');
  }

  function clearUploadLog(name) {
    const row = document.getElementById(uploadLogId(name));
    if (row) row.remove();
  }

  /** 올린 문서를 읽어 서식 목차와 참가자격을 뽑는다 (사용자가 누를 때만) */
  function readDocs() {
    if (!uploadedDocs.length) return toast('먼저 문서를 올려주세요.');
    const gen = proposeGen;
    const status = document.getElementById('rfp-status');
    const saved = status.innerHTML;
    status.className = 'checklist warn';
    status.innerHTML = '<span class="check-icon warn">…</span>' +
      '<span>올린 문서를 읽는 중… 문서가 크면 1분 정도 걸립니다.</span>';

    google.script.run
      .withSuccessHandler(function (out) {
        if (gen !== proposeGen) return;
        renderUploadList();
        rfpBodyText = out.bodyText || '';
        rfpForms = out.forms || [];
        rfpQualifications = out.quals || [];
        toast((out.read || []).join(' · '));
        renderQualifications(rfpQualifications);
        renderFormIndex({ forms: rfpForms, tables: [], summary: {
          fillable: rfpForms.filter(function (f) { return f.fillable; }).length
        } });
      })
      .withFailureHandler(function (err) {
        if (gen !== proposeGen) return;
        status.innerHTML = saved;
        toast(String(err.message || err).split(String.fromCharCode(10))[0]);
      })
      .readDocsFromUploads({ files: uploadedDocs.map(toPayload) });
  }

  function toPayload(u) {
    return { name: u.name, dataBase64: u.dataBase64 };
  }

  const KIND_BADGE = { perf: '실적', hr: '인력', company: '회사정보',
                       holding: '보유서류', writing: '직접작성',
                       reference: '읽는 문서', unknown: '확인 필요' };

  function renderFormIndex(res) {
    const forms = res.forms || [];
    const sec = document.getElementById('step-forms');
    if (!forms.length) { sec.style.display = 'none'; return; }
    sec.style.display = '';

    const sum = res.summary || {};
    document.getElementById('forms-hint').textContent =
      forms.length + '건 · 자동작성 가능 ' + sum.fillable + '건';

    // 서식 이름에 맞는 표가 실제로 문서 안에 있는지
    const tableByKind = {};
    (res.tables || []).forEach(function (t) {
      if (!tableByKind[t.kind]) tableByKind[t.kind] = t;
    });

    document.getElementById('form-index').innerHTML = forms.map(function (f) {
      const t = f.fillable ? tableByKind[f.kind] : null;
      const note = f.fillable
        ? (t ? '표 확인됨 · 빈 행 ' + t.emptyRows + '개' : '문서에서 표를 찾지 못했습니다')
        : (f.kind === 'holding' ? '입찰서류 탭에서 최신본을 받으세요'
                                : (f.kind === 'writing' ? '담당자가 작성' : ''));
      const cls = f.fillable ? (t ? 'ready' : 'nofile') : 'manual';
      return '<div class="form-item ' + cls + '">' +
        '<span class="form-no">' + escapeHtml(f.no) + '호</span>' +
        '<span class="form-body">' +
          '<span class="form-title">' + escapeHtml(f.name) + '</span>' +
          (note ? '<span class="form-note">' + escapeHtml(note) + '</span>' : '') +
        '</span>' +
        '<span class="form-badge kind-' + f.kind + '">' +
          (KIND_BADGE[f.kind] || f.kindLabel) + '</span>' +
      '</div>';
    }).join('');
  }

  /** 첨부목록 칸이 생기기 전에 수집된 공고 — 한 번만 나라장터에서 받아 채운다 */
  function refreshNotice() {
    const gen = proposeGen;
    document.getElementById('notice-list').innerHTML =
      '<div class="attach-empty">나라장터에서 가져오는 중…</div>';
    document.getElementById('notice-actions').innerHTML = '';

    google.script.run
      .withSuccessHandler(function (res) {
        if (gen !== proposeGen) return;
        proposePack = res;
        renderPack(res);
      })
      .withFailureHandler(function (err) {
        if (gen !== proposeGen) return;
        document.getElementById('notice-list').innerHTML =
          '<div class="attach-empty">가져오지 못했습니다.<br>' +
          escapeHtml(err.message || err) + '</div>';
      })
      .refreshNoticeAttachments(proposeBid.no, proposeBid.ord);
  }

  function addAction(parent, cls, label, onClick) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = cls; b.textContent = label;
    b.addEventListener('click', onClick);
    parent.appendChild(b);
  }

  function addLink(parent, cls, label, href) {
    const a = document.createElement('a');
    a.className = cls; a.href = href; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = label;
    parent.appendChild(a);
  }


  // ── 서식 직접 올리기 ──

  function initUpload() {
    const zone = document.getElementById('upload-zone');
    const input = document.getElementById('upload-input');

    input.addEventListener('change', function () {
      handleFiles(Array.prototype.slice.call(input.files));
      input.value = '';
    });

    ['dragenter', 'dragover'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) {
        e.preventDefault(); zone.classList.add('over');
      });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) {
        e.preventDefault(); zone.classList.remove('over');
      });
    });
    zone.addEventListener('drop', function (e) {
      handleFiles(Array.prototype.slice.call(e.dataTransfer.files));
    });
  }

  function handleFiles(files) {
    files.forEach(function (file) {
      if (/\.hwp$/i.test(file.name)) {
        logUpload(file.name, 'busy', '브라우저에서 변환 중…');
        window.convertLegacyHwp(file).then(function (converted) {
          handleFiles([converted]);
          logUpload(file.name, 'ok', 'HWPX 변환·검증 완료 (원본 HWP는 전송되지 않음) · 한컴 최종 검토 필수');
        }).catch(function (error) {
          logUpload(file.name, 'fail', error.message + ' 한컴에서 HWPX로 저장해 다시 올려주세요.');
        });
        return;
      }
      if (!/\.(hwpx|pdf)$/i.test(file.name)) {
        logUpload(file.name, 'fail', 'hwpx 또는 pdf 만 올릴 수 있습니다');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        logUpload(file.name, 'fail',
          Math.round(file.size / 1024 / 1024) + 'MB — 10MB 이하로 줄여주세요');
        return;
      }

      logUpload(file.name, 'busy', '읽는 중…');
      const reader = new FileReader();
      reader.onload = function () {
        // 파일은 브라우저 메모리에만 둔다. 드라이브에 저장하지 않는다.
        const ext = file.name.toLowerCase().replace(/^.*\./, '');
        uploadedDocs = uploadedDocs.filter(function (u) { return u.name !== file.name; });
        uploadedDocs.push({
          name: file.name,
          ext: ext,
          size: file.size,
          fillable: ext === 'hwpx',
          checked: ext === 'hwpx',
          dataBase64: String(reader.result).split(',')[1] || ''
        });
        logUpload(file.name, 'ok', '준비됨');
        renderUploadList();
        renderProposeSelected();
      };
      reader.onerror = function () { logUpload(file.name, 'fail', '파일을 읽지 못했습니다'); };
      reader.readAsDataURL(file);
    });
  }

  function logUpload(name, state, msg) {
    const log = document.getElementById('upload-log');
    const id = uploadLogId(name);
    let row = document.getElementById(id);
    if (!row) {
      row = document.createElement('div');
      row.id = id;
      log.appendChild(row);
    }
    row.className = 'upload-row ' + state;
    row.innerHTML = '<span class="upload-name">' + escapeHtml(name) + '</span>' +
                    '<span class="upload-msg">' + escapeHtml(msg) + '</span>';

    // 받아들인 파일은 아래 목록에 나타나므로 로그 줄을 오래 둘 필요가 없다.
    // 거부된 파일도 계속 남아 있으면 올라간 것처럼 보인다.
    if (state === 'ok') setTimeout(function () { clearUploadLog(name); }, 1500);
    if (state === 'fail') setTimeout(function () { clearUploadLog(name); }, 6000);
  }

  // ── 2단계: 분석 ──

  /**
   * 실적·인력 목록.
   *
   * 실무에서 사람을 어디 배치할지는 그때그때 정하는 것이라 기준이 없다.
   * 그래서 점수로 거르지 않고 DB 전체를 보여주고 사람이 고르게 한다.
   * 대신 찾기 쉽도록 검색과 정렬만 붙였다.
   */
  function renderPerfList() {
    const wrap = document.getElementById('propose-perf-list');
    const q = (document.getElementById('propose-perf-search').value || '').trim().toLowerCase();
    const sortBy = document.getElementById('propose-perf-sort').value;

    let list = ALL_RECORDS.filter(function (r) {
      if (!r.taskName) return false;
      if (!q) return true;
      return (r.taskName + ' ' + (r.org || '') + ' ' + (r.field || '') + ' ' + (r.desc || ''))
        .toLowerCase().indexOf(q) > -1;
    });

    list.sort(function (a, b) {
      switch (sortBy) {
        case 'amount': return (Number(b.amount) || 0) - (Number(a.amount) || 0);
        case 'name':   return String(a.taskName).localeCompare(String(b.taskName), 'ko');
        case 'field':  return String(a.field || '').localeCompare(String(b.field || ''), 'ko') ||
                              (Number(b.year) || 0) - (Number(a.year) || 0);
        default:       return (Number(b.year) || 0) - (Number(a.year) || 0);
      }
    });

    proposePerfList = list;
    document.getElementById('propose-perf-count').textContent =
      list.length + '건 / 전체 ' + ALL_RECORDS.length + '건';

    if (!list.length) {
      wrap.innerHTML = '<div class="empty-state">조건에 맞는 실적이 없습니다.</div>';
      return;
    }

    wrap.innerHTML = list.map(function (r, i) {
      const amount = r.amount ? Math.round(r.amount / 10000).toLocaleString() + '만원' : '-';
      const checked = selectedPerf.has(perfKeyOf(r)) ? ' checked' : '';
      return '<label class="pick-row compact">' +
        '<input type="checkbox" data-idx="' + i + '"' + checked + '>' +
        '<span class="pick-main">' +
          '<span class="pick-title">' + escapeHtml(r.taskName) + '</span>' +
          '<span class="pick-sub">' + escapeHtml(r.year || '') + ' · ' +
            escapeHtml(r.field || '') + ' · ' + escapeHtml(r.org || '') + ' · ' + amount + '</span>' +
        '</span>' +
      '</label>';
    }).join('');

    wrap.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        const r = proposePerfList[Number(cb.dataset.idx)];
        const key = perfKeyOf(r);
        if (cb.checked) selectedPerf.add(key); else selectedPerf.delete(key);
        renderProposeSelected();
      });
    });
  }

  function perfKeyOf(r) {
    return String(r.taskName || '').replace(/\s+/g, '') + '|' + (r.year || '');
  }

  function renderProposePeople() {
    const wrap = document.getElementById('propose-hr-list');
    const q = (document.getElementById('propose-hr-search').value || '').trim().toLowerCase();

    const list = ALL_HR_RECORDS
      .filter(function (r) { return String(r.status || '').indexOf('재직') === 0; })
      .filter(function (r) {
        if (!q) return true;
        return (r.name + ' ' + r.dept + ' ' + r.position).toLowerCase().indexOf(q) > -1;
      })
      .sort(function (a, b) {
        return String(a.dept || '').localeCompare(String(b.dept || ''), 'ko') ||
               String(a.name || '').localeCompare(String(b.name || ''), 'ko');
      });

    document.getElementById('propose-hr-count').textContent =
      list.length + '명 / 재직 ' + ALL_HR_RECORDS.filter(function (r) {
        return String(r.status || '').indexOf('재직') === 0;
      }).length + '명';

    if (!list.length) {
      wrap.innerHTML = '<div class="empty-state">해당하는 인력이 없습니다.</div>';
      return;
    }

    wrap.innerHTML = list.map(function (r) {
      const checked = selectedHR.has(r.name) ? ' checked' : '';
      return '<label class="pick-row compact">' +
        '<input type="checkbox" data-name="' + escapeHtml(r.name) + '"' + checked + '>' +
        '<span class="pick-main">' +
          '<span class="pick-title">' + escapeHtml(r.name) +
            '<span class="pick-pos">' + escapeHtml(r.position || '') + '</span></span>' +
          '<span class="pick-sub">' + escapeHtml(r.dept || '') + ' · 경력 ' +
            escapeHtml(r.career || '-') + '</span>' +
        '</span>' +
      '</label>';
    }).join('');

    wrap.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        if (cb.checked) selectedHR.add(cb.dataset.name); else selectedHR.delete(cb.dataset.name);
        renderProposeSelected();
      });
    });
  }

  function renderProposeSelected() {
    const parts = [];
    const docs = uploadedDocs.filter(function (u) { return u.checked; }).length;
    if (docs) parts.push('문서 ' + docs + '개');
    if (selectedPerf.size) parts.push('실적 ' + selectedPerf.size + '건');
    if (selectedHR.size) parts.push('인력 ' + selectedHR.size + '명');
    document.getElementById('propose-selected').textContent =
      parts.length ? parts.join(' · ') + ' 선택됨' : '선택 없음';
  }

  // ── 3단계: 서식 생성 ──

  function generateForms() {
    const targets = uploadedDocs.filter(function (u) { return u.fillable && u.checked; });
    if (!targets.length) return toast('2단계에서 채울 문서를 먼저 체크해주세요.');
    if (!selectedPerf.size && !selectedHR.size) {
      return toast('실적이나 인력을 먼저 선택해주세요.');
    }

    const selection = {
      perfKeys: Array.from(selectedPerf),
      hrNames: Array.from(selectedHR)
    };

    const btn = document.getElementById('fill-forms');
    btn.disabled = true;
    btn.textContent = '생성 중…';

    const results = [];
    let done = 0;
    targets.forEach(function (u) {
      fillFormViaPptAx(u, selection)
        .then(function (out) {
          results.push({ ok: true, form: u, out: out });
          if (++done === targets.length) finishGenerate(results, btn);
        })
        .catch(function (pptAxErr) {
          console.warn('PPT_AX fill failed. Falling back to Apps Script.', pptAxErr);
          google.script.run
            .withSuccessHandler(function (out) {
              out.engine = 'apps_script';
              out.fallbackReason = String(pptAxErr && pptAxErr.name === 'AbortError' ? '응답 시간 초과' : (pptAxErr && pptAxErr.message) || '연결 실패');
              results.push({ ok: true, form: u, out: out });
              if (++done === targets.length) finishGenerate(results, btn);
            })
            .withFailureHandler(function (err) {
              results.push({ ok: false, form: u, error: String(err.message || err) });
              if (++done === targets.length) finishGenerate(results, btn);
            })
            .fillFormFromUpload({
              name: u.name, dataBase64: u.dataBase64, selection: selection,
              bidNo: proposeBid.no, bidOrd: proposeBid.ord
            });
        });
    });
  }

  /** base64 결과를 그대로 파일로 내려받는다 (드라이브를 거치지 않는다) */
  async function fillFormViaPptAx(uploaded, selection) {
    if (!/\.hwpx$/i.test(uploaded.name)) {
      throw new Error('PPT_AX는 hwpx 서식만 채울 수 있습니다.');
    }

    const file = base64ToFile(uploaded.dataBase64, uploaded.name, 'application/x-hwpml');
    const form = new FormData();
    form.append('file', file, uploaded.name);
    form.append('values_json', JSON.stringify(buildPptAxHwpxValues(selection)));

    // 연결되지 않는 PPT_AX 때문에 서식 생성이 멈추지 않도록 시간 제한을 둔다.
    const ctl = new AbortController();
    const timer = setTimeout(function () { ctl.abort(); }, 8000);
    let response;
    try {
      response = await fetch(PPT_AX_API_BASE_URL + '/forms/hwpx/fill', {
        method: 'POST',
        body: form,
        signal: ctl.signal
      });
    } finally { clearTimeout(timer); }
    let data = null;
    try {
      data = await response.json();
    } catch (e) {
      data = null;
    }
    if (!response.ok) {
      throw new Error(data && data.detail ? data.detail : 'PPT_AX 서식 작성에 실패했습니다.');
    }

    const fileResponse = await fetch(PPT_AX_API_BASE_URL + data.download_url, { signal: AbortSignal.timeout(15000) });
    if (!fileResponse.ok) {
      throw new Error('PPT_AX 결과 파일을 내려받지 못했습니다.');
    }
    const resultBlob = await fileResponse.blob();
    const dataBase64 = await blobToBase64(resultBlob);
    return {
      name: data.output_filename || uploaded.name.replace(/\.hwpx$/i, '_pptax.hwpx'),
      dataBase64: dataBase64,
      engine: 'ppt_ax',
      report: {
        company: countFilledByPrefix(data.filled || [], 'company.'),
        bid: countFilledByPrefix(data.filled || [], 'bid.'),
        perf: countFilledByPrefix(data.filled || [], 'track_records.'),
        hr: countFilledByPrefix(data.filled || [], 'personnel.'),
        tables: 1,
        foundTables: [],
        overflow: [],
        pptAxMissing: data.missing || [],
        pptAxSkipped: data.skipped || [],
        // PPT_AX는 칸 위치를 알려 주지 않으므로 채운 항목 키만 보여 준다 (위치·값은 지어내지 않는다).
        entries: (data.filled || []).map(function (key) {
          return { kind: '', field: String(key), label: String(key), value: '', source: 'PPT_AX', section: '', table: 0, row: 0, col: 0, verified: null };
        })
      },
      missing: (data.missing || []).map(function (m) {
        return m.field_key || m.message || '';
      }).filter(Boolean),
      dummy: []
    };
  }

  function buildPptAxHwpxValues(selection) {
    const company = (proposePack && proposePack.company) || {};
    return {
      company: {
        name: company.name || company.companyName || '인트윈',
        ceo_name: company.ceo_name || company.ceoName || company.ceo || company.representative || '',
        business_no: company.business_no || company.businessNo || company.bizNo || '',
        corporate_no: company.corporate_no || company.corpNo || '',
        address: company.address || '',
        phone: company.phone || company.tel || '',
        email: company.email || ''
      },
      bid: {
        name: proposeBid && proposeBid.name || '',
        no: proposeBid && proposeBid.no || '',
        noticeOrg: proposeBid && proposeBid.noticeOrg || '',
        demandOrg: proposeBid && proposeBid.demandOrg || '',
        budget: proposeBid && proposeBid.budget || '',
        closeDt: proposeBid && proposeBid.closeDt || ''
      },
      personnel: selectedHrRowsForPptAx(),
      track_records: selectedPerfRowsForPptAx(),
      selection: selection || {}
    };
  }

  function base64ToFile(base64, name, type) {
    const bin = atob(base64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], name, { type: type || 'application/octet-stream' });
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () {
        resolve(String(reader.result || '').split(',')[1] || '');
      };
      reader.onerror = function () { reject(new Error('결과 파일을 읽지 못했습니다.')); };
      reader.readAsDataURL(blob);
    });
  }

  function countFilledByPrefix(items, prefix) {
    return (items || []).filter(function (item) {
      return String(item).indexOf(prefix) === 0;
    }).length;
  }

  function uniqueList(items) {
    const seen = {};
    return (items || []).filter(function (item) {
      const key = String(item);
      if (seen[key]) return false;
      seen[key] = true;
      return true;
    });
  }

  function downloadBase64(name, b64) {
    try {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: 'application/octet-stream' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 채운 칸 검토 표 — 항목·값·출처·위치(구역/표/행·열). 쪽 번호는 hwpx 파일만으로 알 수 없어 표시하지 않는다. */
  function renderFillReview(out) {
    const rep = out.report || {};
    const entries = rep.entries || [];
    const engineLabel = out.engine === 'ppt_ax' ? 'PPT_AX' : 'Apps Script';
    const notes = [];
    if (out.fallbackReason) {
      notes.push('PPT_AX 엔진을 쓰지 못해(' + escapeHtml(out.fallbackReason) + ') Apps Script 엔진으로 작성했습니다.');
    }
    function where(e) {
      if (!e.section) return '위치 정보 없음';
      const m = /section(\d+)\.xml$/.exec(e.section);
      return (m ? '구역 ' + (Number(m[1]) + 1) : e.section) + ' · 표 ' + e.table + ' · ' + e.row + '행 ' + e.col + '열';
    }
    const verified = entries.filter(function (e) { return e.verified === true; }).length;
    const unverified = entries.filter(function (e) { return e.verified === false; }).length;
    const rows = entries.map(function (e) {
      const check = e.verified === true ? '✔ 결과 파일에서 확인' : (e.verified === false ? '⚠ 확인 필요' : '—');
      return '<tr><td>' + escapeHtml(e.label || e.field) + '</td><td>' + (e.value ? escapeHtml(e.value) : '<em>결과 파일에서 확인</em>') +
        '</td><td>' + escapeHtml(e.source || '') + '</td><td>' + escapeHtml(where(e)) + '</td><td>' + check + '</td></tr>';
    }).join('');
    const skipped = (rep.skipped || []).map(function (k) {
      return '<li>' + escapeHtml(k.label) + ' — ' + escapeHtml(k.reason) + '</li>';
    }).join('');
    return '<details class="gen-review" open><summary>채운 내용 검토 · ' + escapeHtml(engineLabel) + ' · ' + entries.length + '칸' +
      (unverified ? ' · 확인 필요 ' + unverified + '칸' : (verified ? ' · 전부 결과 파일에서 확인됨' : '')) + '</summary>' +
      (notes.length ? '<div class="gen-warn">' + notes.join('<br>') + '</div>' : '') +
      (entries.length
        ? '<div class="gen-review-wrap"><table class="gen-review-table"><thead><tr><th>항목</th><th>입력값</th><th>출처</th><th>위치</th><th>검증</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="gen-warn">채워진 칸이 없습니다.</div>') +
      (rep.entriesTruncated ? '<div class="gen-warn">칸이 많아 일부만 표시했습니다.</div>' : '') +
      (skipped ? '<ul class="gen-skipped">' + skipped + '</ul>' : '') +
      '<div class="gen-note">위치는 파일 구조(구역·표·행·열) 기준입니다. 쪽 번호는 한컴에서 문서를 열어야 정해지므로 표시하지 않습니다.</div></details>';
  }

  function finishGenerate(results, btn) {
    btn.disabled = false;
    btn.textContent = '다음 · 서식 생성';

    const ok = results.filter(function (r) { return r.ok; });
    const fail = results.filter(function (r) { return !r.ok; });

    const html =
      '<div class="gen-result">' +
        '<div class="gen-title">서식 ' + ok.length + '건 생성' +
          (fail.length ? ' · ' + fail.length + '건 실패' : '') + '</div>' +
        ok.map(function (r, i) {
          const rep = r.out.report || {};
          const bits = [];
          if (rep.perf) bits.push('실적 ' + rep.perf + '칸');
          if (rep.hr) bits.push('인력 ' + rep.hr + '칸');
          if (rep.company) bits.push('회사정보 ' + rep.company + '칸');
          if (rep.bid) bits.push('공고정보 ' + rep.bid + '칸');

          const warns = (rep.overflow || []).map(function (o) {
            return '⚠ ' + (o.kind === 'perf' ? '실적' : '인력') + ' ' + o.total +
                   '건 중 ' + o.filled + '건만 들어갔습니다 (표에 빈 행이 모자랍니다)';
          });

          // 골랐는데 넣을 표가 없으면 그 사실을 분명히 알린다
          const found = rep.foundTables || [];
          if (selectedPerf.size && !rep.perf && found.indexOf('perf') === -1) {
            warns.push('⚠ 실적 ' + selectedPerf.size + '건을 골랐지만 이 문서에 ' +
              '실적표가 없어 넣지 못했습니다. 표 머리글에 과업명·발주처·계약금액 같은 ' +
              '칸이 있는 서식이어야 합니다.');
          }
          if (selectedHR.size && !rep.hr && found.indexOf('hr') === -1) {
            warns.push('⚠ 인력 ' + selectedHR.size + '명을 골랐지만 이 문서에 ' +
              '인력표가 없어 넣지 못했습니다.');
          }
          if (!rep.tables) {
            warns.push('⚠ 이 문서에는 표가 없습니다. 서식이 맞는지 확인해주세요.' +
              (/_변환\.hwpx$/.test(r.form.name || '')
                ? ' HWP에서 자동 변환한 파일이라 표가 문단으로 바뀌었을 수 있습니다. 한컴에서 HWPX로 직접 저장해 다시 올려보세요.' : ''));
          }
          const over = warns.join('<br>');
          return '<div class="gen-row">' +
            '<div class="gen-name">' + escapeHtml(r.out.name) + '</div>' +
            '<div class="gen-meta">' + (bits.join(' · ') || '채워진 칸 없음') + '</div>' +
            (over ? '<div class="gen-warn">' + over + '</div>' : '') +
            renderFillReview(r.out) +
            '<div class="gen-links">' +
              '<button type="button" class="btn-primary gen-dl" data-i="' + i + '">작성된 서식 내려받기</button> ' +
              '<button type="button" class="btn-ghost gen-src" data-i="' + i + '">원본 내려받기</button>' +
            '</div>' +
          '</div>';
        }).join('') +
        fail.map(function (r) {
          return '<div class="gen-row failed">' +
            '<div class="gen-name">' + escapeHtml(r.form.name || '') + '</div>' +
            '<div class="gen-warn">' + escapeHtml(r.error.split('\n')[0]) + '</div>' +
          '</div>';
        }).join('') +
        (ok.length && ok[0].out.missing && ok[0].out.missing.length
          ? '<div class="gen-warn">⚠ 회사정보가 비어 있어 못 채운 항목: ' +
            escapeHtml(ok[0].out.missing.join(', ')) +
            '<br>[입찰공고] → [회사정보 시트 만들기] 에서 값을 채우면 다음부터 자동으로 들어갑니다.</div>'
          : '') +
        (ok.length && ok[0].out.dummy && ok[0].out.dummy.length
          ? '<div class="gen-warn">⚠ 자리표시 값으로 보이는 항목: ' +
            escapeHtml(ok[0].out.dummy.join(', ')) + ' — 제출 전 확인하세요.</div>'
          : '') +
      '</div>';

    document.getElementById('step-forms').insertAdjacentHTML('afterend', html);

    // 만들어지자마자 한 번 내려받고, 버튼으로 다시 받을 수도 있게 한다
    document.querySelectorAll('.gen-dl').forEach(function (b) {
      b.addEventListener('click', function () {
        const r = ok[Number(b.dataset.i)];
        if (!downloadBase64(r.out.name, r.out.dataBase64)) {
          toast('브라우저가 내려받기를 막았습니다. 팝업 차단을 풀어주세요.');
        }
      });
    });
    document.querySelectorAll('.gen-src').forEach(function (b) {
      b.addEventListener('click', function () {
        const r = ok[Number(b.dataset.i)];
        if (!downloadBase64(r.form.name, r.form.dataBase64)) toast('브라우저가 내려받기를 막았습니다.');
      });
    });
    // 여러 파일을 한꺼번에 자동 내려받으면 브라우저가 두 번째부터 막으므로 자동 내려받기는 하지 않고,
    // 아래 검토 표를 확인한 뒤 버튼으로 받게 한다. 원본(올린 파일)은 변경하지 않고 별도 이름으로 저장된다.

    // 서식이 나왔으면 다음 단계로 넘어갈 수 있게 한다
    if (ok.length) {
      const fb = document.getElementById('fill-forms');
      fb.textContent = '서식 다시 만들기';
      fb.className = 'btn-ghost';
      document.getElementById('go-proposal').style.display = '';
    }

    toast(ok.length ? '서식을 생성했습니다. 아래 검토 표를 확인한 뒤 내려받으세요.' : '서식 생성에 실패했습니다.');
  }

  // ── 제안서 작성 (아직 목업) ──

  /** 표준 목차 — 실제로는 제안요청서의 평가항목에서 뽑아야 한다 */
  const PROPOSAL_OUTLINE = [
    { no: 'I',    title: '일반현황',      note: '회사 개요·조직·실적',      auto: true },
    { no: 'II',   title: '사업 이해도',    note: '발주 배경, 환경 분석' },
    { no: 'III',  title: '추진 전략',      note: '기본 방향, 차별화' },
    { no: 'IV',   title: '세부 수행계획',   note: '과업별 실행계획' },
    { no: 'V',    title: '운영 계획',      note: '현장 운영·동선·인력 배치' },
    { no: 'VI',   title: '홍보 계획',      note: '채널·콘텐츠·일정' },
    { no: 'VII',  title: '인력 투입계획',   note: '조직도·역할·투입률',      auto: true },
    { no: 'VIII', title: '일정 계획',      note: 'WBS' },
    { no: 'IX',   title: '품질·위험 관리',  note: '리스크 대응' },
    { no: 'X',    title: '기대효과',       note: '정량·정성 성과' }
  ];

  let selectedTemplate = null;
  let pptTemplate = null;     // 서버에 등록된 실제 템플릿
  let rfpBodyText = '';       // 읽은 제안요청서 본문 — 제안서 기획 재료

  function openProposal() {
    if (!proposeBid) return;
    selectedTemplate = null;
    switchTab('proposal');

    document.getElementById('proposal-bid-name').textContent = proposeBid.name;
    document.getElementById('proposal-bid-meta').textContent =
      [proposeBid.noticeOrg, proposeBid.method,
       proposeBid.budget ? '예산 ' + Math.round(proposeBid.budget / 10000).toLocaleString() + '만원' : '',
       proposeBid.closeDt ? '마감 ' + proposeBid.closeDt : '']
      .filter(Boolean).join(' · ');

    renderProposalSpec();
    renderProposalOutline();
    renderProposalTemplates();      // 서버 응답 오기 전 자리표시
    renderProposalSelected();

    google.script.run
      .withSuccessHandler(function (info) {
        pptTemplate = info;
        renderProposalTemplates();
        renderProposalSelected();
      })
      .withFailureHandler(function (e) {
        pptTemplate = { ok: false, reason: e.message };
        renderProposalTemplates();
      })
      .getPptTemplateInfo();
  }

  /** 제안서 규격 — 제안요청서에서 읽어야 하지만 아직 연결 전이라 자리만 잡아둔다 */
  function renderProposalSpec() {
    const rows = [

  function generateProposal() {
    if (!proposeBid || !(pptTemplate && pptTemplate.ok)) return;

    const btn = document.getElementById('proposal-generate');
    const note = document.getElementById('proposal-selected');
    btn.disabled = true;
    btn.textContent = '만드는 중…';
    note.textContent = rfpBodyText
      ? '공고문을 읽고 구성을 짜는 중입니다. 1분정도 걸립니다.'
      : '제안요청서 없이 공고 정보만으로 짜는 중입니다. 1분정도 걸립니다.';

    google.script.run
      .withSuccessHandler(function (res) {
        downloadBase64(res.name, res.dataBase64);
        btn.disabled = false;
        btn.textContent = '초안 다시 만들기';
        note.textContent = res.name;
        renderProposalReport(res.report);

      .withFailureHandler(function (e) {

        btn.textContent = '초안 만들기';
        note.textContent = pptTemplate.name;
        renderProposalReport(['실패: ' + e.message]);

      .composeProposalPpt(proposeBid.no, proposeBid.ord, rfpBodyText);

    google.script.run
      .withSuccessHandler(function (res) {

          document.getElementById('leave-summary').innerHTML = '';

  function leaveStatus(p) {
    if (p.overHours > 0) return 'issue';       // 발생보다 많이 썼다 — 원장이 틀렸다는 신호
    if (p.soonHours > 0) return 'soon';
    if (p.leftHours > 0) return 'left';
    return 'none';

  const LEAVE_LABEL = { issue: '확인 필요', soon: '소멸 임박', left: '잔여', none: '없음' };
  const LEAVE_TONE  = { issue: 'expired', soon: 'imminent', left: 'normal', none: 'none' };

  function renderLeaveSummary() {
    const wrap = document.getElementById('leave-summary');
    const t = LEAVE_META.totals;

    if (!t.people) {
      wrap.className = 'doc-summary ok';
      wrap.innerHTML = '<span class="doc-summary-icon">·</span>' +
        '<span class="doc-summary-text">원장에 기록이 없습니다</span>';
      return;
    }
    if (!t.soonPeople && !t.overPeople) {
      wrap.className = 'doc-summary ok';
      wrap.innerHTML = '<span class="doc-summary-icon">✓</span>' +
        '<span class="doc-summary-text">소멸 임박 없음 · 전사 잔여 ' + t.leftHours + '시간</span>';
      return;
    }

    wrap.className = 'doc-summary alert';
    let chips = '';
    if (t.overPeople) {
      chips += '<button type="button" class="doc-chip expired" data-status="issue">' +
               '확인 필요 <b>' + t.overPeople + '</b>명</button>';
