<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">

<style>
  /* ============================================================
     인트윈 사내 포털 — 디자인 토큰
     · 색: 로고에서 추출 (green #518D79 / amber #FBBE51 / teal #2CB790)
     · 타이포·간격·반경: comp_lib/web 의 client-common 토큰 체계를 이식
     ============================================================ */
  :root {
    /* ── 브랜드 ── */
    --brand-green: #518D79;
    --brand-amber: #FBBE51;
    --brand-teal:  #2CB790;

    /* ── Primary (green scale) ──
       primary-1 은 흰 바탕 본문 대비 5.7:1 — 텍스트로 써도 안전하다.
       브랜드 원색(#518D79)은 3.9:1 이라 큰 글씨·아이콘·테두리 전용. */
    --primary-1: #3F7060;
    --primary-2: #518D79;
    --primary-3: #7BAE9C;
    --primary-4: #A6C9BD;
    --primary-5: #ECF4F1;
    --primary-6: #D3E5DE;
    --primary-black: #1F2422;
    --primary-white: #FCFDFC;

    /* ── Amber / Teal ── */
    --amber-1: #B8830F;
    --amber-2: #FBBE51;
    --amber-5: #FEF5E2;
    --teal-1: #1B8C6C;
    --teal-2: #2CB790;
    --teal-5: #E2F6F0;

    /* ── Grey ── */
    --grey-1: #222427;
    --grey-2: #555555;
    --grey-3: #C0C0C0;
    --grey-4: #E9E9E9;
    --grey-5: #F8F8F8;

    /* ── Surface ── */
    --background: #FFFFFF;
    --surface: #FCFCFF;
    --foreground: #222427;
    --border: #E2E2E2;
    --border-active: #555555;
    --headline: var(--primary-1);
    --disabled: #C0C0C0;
    --accent-red: #EA3942;
    --accent-green: #2CC16D;

    /* 차트가 읽어가는 강조색 */
    --accent: var(--primary-1);

    /* ── 분야 색 (흰 바탕 기준 CVD 검증 완료) ── */
    --field-edu:     #3B6E8F;
    --field-startup: #1F6F5C;
    --field-event:   #B8892B;
    --field-promo:   #A24B72;
    --field-it:      #5B5FA6;
    --field-region:  #8A5A3B;
    --field-none:    #9A9488;

    /* ── 타이포 ── */
    --font: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui,
            'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    --mono: 'Fira Code', 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

    --fw-regular: 400;
    --fw-medium: 500;
    --fw-bold: 700;

    --fs-display: 42px;   --lh-display: 50px;
    --fs-h1: 40px;        --lh-h1: 48px;
    --fs-h2: 24px;        --lh-h2: 29px;
    --fs-h3: 18px;        --lh-h3: 22px;
    --fs-h4: 14px;        --lh-h4: 18px;
    --fs-p: 12px;         --lh-p: 16px;
    --fs-caption: 10px;   --lh-caption: 12px;
    --fs-button: 12px;

    /* ── 반경 ── */
    --br-pill: 1000px;
    --br-nav: 40px;
    --br-card-large: 16px;
    --br-card: 12px;
    --br-card-small: 10px;

    /* ── 간격 ── */
    --sp-section: 50px;
    --sp-content: 34px;
    --sp-card: 32px;
    --sp-element: 24px;
    --sp-small: 12px;
    --sp-card-padding: 24px;
    --sp-page-padding: 16px;
  }

  @media (min-width: 768px) {
    :root {
      --fs-display: 68px;   --lh-display: 80px;
      --fs-h1: 48px;        --lh-h1: 58px;
      --fs-h2: 32px;        --lh-h2: 40px;
      --fs-h3: 24px;        --lh-h3: 29px;
      --fs-h4: 18px;        --lh-h4: 23px;
      --fs-p: 14px;         --lh-p: 18px;
      --fs-caption: 12px;   --lh-caption: 14px;
      --fs-button: 14px;

      --sp-content: 64px;
      --sp-small: 16px;
      --sp-card-padding: 32px;
      --sp-page-padding: 40px;
    }
  }

  /* ============================================================
     기본
     ============================================================ */
  * {
    box-sizing: border-box;
    word-break: keep-all;   /* 한글 어절 단위 줄바꿈 — comp_lib 전역 규칙 */
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font);
    font-size: var(--fs-p);
    line-height: var(--lh-p);
    font-weight: var(--fw-regular);
    color: var(--foreground);
    background: var(--background);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; }
  button { font-family: inherit; }

  /* ============================================================
     배경 — 홈에서만 은은하게 깔리는 그린/앰버 워시 + 노드 메시
     ============================================================ */
  .mesh {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: .5;
  }
  .mesh line {
    stroke: var(--primary-4);
    stroke-width: 1;
    opacity: .35;
  }
  .mesh circle {
    fill: var(--primary-3);
    opacity: .5;
  }
  .mesh circle.pulse {
    animation: nodePulse 4s ease-in-out infinite;
  }
  .mesh circle.pulse:nth-of-type(2) { animation-delay: .8s; }
  .mesh circle.pulse:nth-of-type(3) { animation-delay: 1.6s; }
  .mesh circle.pulse:nth-of-type(4) { animation-delay: 2.4s; }
  .mesh circle.pulse:nth-of-type(5) { animation-delay: 3.2s; }

  @keyframes nodePulse {
    0%, 100% { opacity: .35; r: 3; }
    50%      { opacity: .9;  r: 5; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 520px at 18% 8%,  rgba(81, 141, 121, .10), transparent 62%),
      radial-gradient(760px 460px at 88% 22%, rgba(251, 190, 81, .13), transparent 60%),
      radial-gradient(680px 480px at 60% 96%, rgba(44, 183, 144, .08), transparent 62%);
  }

  /* 서브 페이지에서는 배경 장식을 걷어낸다 — 데이터를 읽는 화면이므로 */
  body.subpage .mesh,
  body.subpage .vignette { display: none; }

  #app { position: relative; z-index: 1; }

  /* ============================================================
     홈 (포털)
     ============================================================ */
  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 72px 40px 40px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .brand {
    text-align: center;
    margin-bottom: var(--sp-content);
  }

  .logotype {
    height: 128px;
    width: auto;
    display: block;
    margin: 0 auto 20px;
  }

  .brand-tagline {
    font-size: var(--fs-h4);
    line-height: var(--lh-h4);
    color: var(--grey-2);
    font-weight: var(--fw-regular);
    letter-spacing: -.005em;
  }
  .brand-tagline .sep {
    color: var(--primary-4);
    margin: 0 8px;
  }

  /* ── 검색 ── */
  .search-wrap {
    width: 100%;
    max-width: 560px;
    margin-bottom: var(--sp-content);
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 8px 0 18px;
    background: var(--background);
    border: 1.5px solid var(--border);
    border-radius: var(--br-pill);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search-box:hover { border-color: var(--primary-3); }
  .search-box:focus-within {
    border-color: var(--primary-2);
    box-shadow: 0 0 0 4px var(--primary-5);
  }
  .search-box svg {
    width: 18px;
    height: 18px;
    flex: none;
    color: var(--grey-3);
  }
  .search-box:focus-within svg { color: var(--primary-2); }

  .search-box input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: var(--fs-h4);
    color: var(--primary-black);
  }
  .search-box input::placeholder { color: var(--grey-3); }

  .search-kbd {
    flex: none;
    font-family: var(--mono);
    font-size: var(--fs-caption);
    color: var(--grey-2);
    background: var(--grey-5);
    border: 1px solid var(--border);
    border-radius: var(--br-pill);
    padding: 5px 12px;
  }

  /* ── 카드 그리드 ── */
  .portal-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
  }

  .portal-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    text-align: left;
    padding: 22px 20px 24px;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--br-card-large);
    cursor: pointer;
    transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  .portal-card:hover:not(.disabled) {
    border-color: var(--primary-2);
    transform: translateY(-3px);
    box-shadow: 0 10px 28px -14px rgba(31, 36, 34, .28);
  }
  .portal-card:focus-visible {
    outline: none;
    border-color: var(--primary-2);
    box-shadow: 0 0 0 4px var(--primary-5);
  }

  .portal-card.disabled {
    cursor: default;
    background: var(--grey-5);
    border-style: dashed;
  }
  .portal-card.disabled .card-icon,
  .portal-card.disabled .card-title,
  .portal-card.disabled .card-eyebrow,
  .portal-card.disabled .card-desc { opacity: .45; }

  .card-icon {
    width: 26px;
    height: 26px;
    color: var(--primary-2);
    margin-bottom: 10px;
  }
  .portal-card:nth-child(2) .card-icon { color: var(--teal-1); }
  .portal-card:nth-child(4) .card-icon { color: var(--amber-1); }

  .card-eyebrow {
    font-family: var(--mono);
    font-size: var(--fs-caption);
    line-height: var(--lh-caption);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--grey-3);
  }

  .card-title {
    font-size: var(--fs-h3);
    line-height: var(--lh-h3);
    font-weight: var(--fw-bold);
    color: var(--primary-black);
    letter-spacing: -.01em;
  }

  .card-desc {
    font-size: var(--fs-p);
    line-height: var(--lh-p);
    color: var(--grey-2);
  }

  .badge {
    position: absolute;
    top: 14px;
    right: 14px;
    font-size: var(--fs-caption);
    line-height: 18px;
    font-weight: var(--fw-medium);
    color: var(--grey-2);
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0 7px;
  }

  .portal-footer {
    margin-top: var(--sp-content);
    text-align: center;
    font-size: var(--fs-p);
    line-height: 1.7;
    color: var(--grey-3);
  }
  .portal-footer strong {
    color: var(--grey-2);
    font-weight: var(--fw-medium);
  }

  /* ============================================================
     서브 페이지 헤더
     ============================================================ */
  .subhead {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .subhead-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 var(--sp-page-padding);
    height: 64px;
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .home-link {
    flex: none;
    font-family: var(--mono);
    font-size: var(--fs-h4);
    font-weight: var(--fw-bold);
    letter-spacing: .04em;
    color: var(--primary-1);
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .home-link:hover { opacity: .6; }

  .tab-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }

  /* comp_lib nav-button: 비활성은 작은 라운드, 활성은 pill 로 채운다 */
  .tab-btn {
    height: 36px;
    padding: 0 16px;
    border: none;
    background: transparent;
    border-radius: var(--br-card-small);
    font-size: var(--fs-button);
    font-weight: var(--fw-regular);
    color: var(--grey-2);
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn:hover { background: var(--grey-5); color: var(--primary-black); }
  .tab-btn.active {
    background: var(--primary-1);
    color: var(--primary-white);
    font-weight: var(--fw-bold);
    border-radius: var(--br-pill);
  }

  .subhead .updated {
    flex: none;
    text-align: right;
    font-size: var(--fs-caption);
    line-height: 1.5;
    color: var(--grey-3);
  }
  .subhead .updated span {
    font-family: var(--mono);
    color: var(--grey-2);
  }

  .subhead .subtitle {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 var(--sp-page-padding) 12px;
    font-size: var(--fs-p);
    color: var(--grey-2);
  }

  .panel-body {
    max-width: 1240px;
    margin: 0 auto;
    padding: var(--sp-element) var(--sp-page-padding) 80px;
  }

  /* ============================================================
     분야 구성 바
     ============================================================ */
  .composition { margin-bottom: var(--sp-element); }

  .composition-label {
    display: flex;
    justify-content: space-between;
    font-size: var(--fs-p);
    color: var(--grey-2);
    margin-bottom: 10px;
  }

  .composition-bar {
    display: flex;
    height: 12px;
    border-radius: var(--br-pill);
    overflow: hidden;
    background: var(--grey-4);
  }
  .composition-seg {
    cursor: pointer;
    transition: opacity .15s ease;
    border-right: 2px solid var(--background);
  }
  .composition-seg:last-child { border-right: none; }
  .composition-seg:hover { opacity: .75; }

  .composition-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 12px;
    font-size: var(--fs-p);
  }
  .composition-legend .item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    color: var(--grey-2);
    transition: color .15s ease;
  }
  .composition-legend .item:hover { color: var(--primary-black); }
  .composition-legend .item.active {
    color: var(--primary-black);
    font-weight: var(--fw-bold);
  }
  .composition-legend .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }

  /* ============================================================
     카드 / 통계 / 차트
     ============================================================ */
  .card {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--br-card);
  }

  .dashboard {
    display: grid;
    grid-template-columns: 220px 1fr 1fr;
    gap: 16px;
    margin-bottom: var(--sp-element);
  }

  .stat-stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .hr-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: var(--sp-element);
  }

  .stat-card { padding: 18px 20px; }

  .stat-label {
    font-size: var(--fs-p);
    color: var(--grey-2);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 26px;
    line-height: 1.2;
    font-weight: var(--fw-bold);
    color: var(--primary-black);
    font-variant-numeric: tabular-nums;
  }

  .chart-card {
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
  }

  .chart-title {
    font-size: var(--fs-p);
    color: var(--grey-2);
    margin-bottom: 14px;
  }

  .chart-body {
    position: relative;
    flex: 1;
    min-height: 190px;
  }

  /* ============================================================
     필터
     ============================================================ */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .filters input,
  .filters select {
    height: 40px;
    padding: 0 14px;
    font-family: inherit;
    font-size: var(--fs-p);
    color: var(--grey-2);
    background: var(--grey-5);
    border: 1px solid var(--border);
    border-radius: 4px;
    outline: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .filters input { flex: 1 1 220px; min-width: 160px; }
  .filters select { flex: 0 1 170px; cursor: pointer; }

  .filters input::placeholder { color: var(--grey-3); }

  .filters input:hover,
  .filters select:hover {
    background: var(--background);
    border-color: var(--border-active);
  }
  .filters input:focus,
  .filters select:focus {
    background: var(--background);
    border-color: var(--primary-2);
    color: var(--primary-black);
    box-shadow: 0 0 0 3px var(--primary-5);
  }

  /* comp_lib Button — ghost 변형 */
  .filters .reset-btn {
    height: 40px;
    padding: 0 18px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: var(--fs-button);
    font-weight: var(--fw-regular);
    color: var(--primary-black);
    background: var(--background);
    border: 1.2px solid var(--border);
    border-radius: var(--br-pill);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .filters .reset-btn:hover {
    background: var(--grey-4);
    border-color: var(--border-active);
  }

  .result-count {
    font-size: var(--fs-p);
    color: var(--grey-3);
    margin-bottom: 10px;
  }

  /* ============================================================
     목록 (ledger)
     ============================================================ */
  .ledger {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--background);
  }

  .empty-state {
    padding: 56px 24px;
    text-align: center;
    font-size: var(--fs-p);
    line-height: 1.8;
    color: var(--grey-3);
  }

  .ledger-row {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .12s ease;
  }
  .ledger-row:last-child { border-bottom: none; }
  .ledger-row:hover { background: var(--grey-5); }

  .ledger-row-main {
    display: grid;
    grid-template-columns: 4px 74px 1fr 160px 130px 24px;
    gap: 14px;
    align-items: center;
  }
  .ledger-row-main.hr-cols  { grid-template-columns: 4px 1fr 110px 110px 130px 24px; }
  .ledger-row-main.bid-cols { grid-template-columns: 62px 1fr 190px 120px 24px; }

  .field-tag-bar {
    width: 4px;
    height: 32px;
    border-radius: var(--br-pill);
  }

  .ledger-year {
    font-family: var(--mono);
    font-size: var(--fs-p);
    color: var(--grey-3);
    font-variant-numeric: tabular-nums;
  }

  .ledger-main-text .task-name {
    font-size: var(--fs-h4);
    font-weight: var(--fw-medium);
    line-height: 1.45;
    color: var(--primary-black);
    margin-bottom: 3px;
  }
  .ledger-main-text .org-name {
    font-size: var(--fs-p);
    color: var(--grey-2);
  }

  .consortium-badge {
    display: inline-flex;
    align-items: center;
    font-size: var(--fs-caption);
    line-height: 18px;
    color: var(--amber-1);
    border: 1px solid var(--amber-2);
    background: var(--amber-5);
    border-radius: 2px;
    padding: 0 7px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .field-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-p);
    color: var(--grey-2);
    white-space: nowrap;
  }
  .field-tag .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }

  /* 인력현황 — 경력 위에, 입사일을 작게 아래에 */
  .hr-tenure {
    font-size: var(--fs-p);
    color: var(--grey-2);
    line-height: 1.35;
    white-space: nowrap;
  }
  .hr-tenure span {
    display: block;
    font-family: var(--mono);
    font-size: var(--fs-caption);
    color: var(--grey-3);
    font-variant-numeric: tabular-nums;
  }

  .ledger-amount {
    font-family: var(--mono);
    font-size: var(--fs-p);
    text-align: right;
    white-space: nowrap;
    color: var(--primary-black);
    font-variant-numeric: tabular-nums;
  }

  .expand-caret {
    font-size: 10px;
    color: var(--grey-3);
    text-align: center;
    transition: transform .15s ease;
  }
  .ledger-row.open .expand-caret { transform: rotate(90deg); }

  .ledger-detail {
    display: none;
    padding: 14px 0 4px 18px;
    font-size: var(--fs-p);
    color: var(--grey-2);
    line-height: 1.7;
  }
  .ledger-row.open .ledger-detail { display: block; }

  .ledger-detail .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px 20px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .ledger-detail .detail-grid b {
    display: block;
    font-size: var(--fs-caption);
    font-weight: var(--fw-regular);
    color: var(--grey-3);
    margin-bottom: 2px;
  }

  .privacy-note {
    margin-top: 14px;
    font-size: var(--fs-caption);
    line-height: 1.6;
    color: var(--grey-3);
  }

  /* ============================================================
     입찰공고
     ============================================================ */
  .dday {
    font-family: var(--mono);
    font-size: var(--fs-p);
    font-weight: var(--fw-bold);
    text-align: center;
    padding: 5px 0;
    border-radius: 2px;
    border: 1px solid transparent;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  .dday-urgent { color: var(--accent-red); border-color: var(--accent-red); }
  .dday-soon   { color: var(--amber-1);    border-color: var(--amber-2); background: var(--amber-5); }
  .dday-far    { color: var(--grey-2);     border-color: var(--border); }
  .dday-closed { color: var(--grey-3);     border-color: var(--grey-4); background: var(--grey-5); }
  .dday-none   { color: var(--grey-3); }

  .bid-kw-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: flex-end;
    overflow: hidden;
    max-height: 42px;
  }
  .bid-kw {
    font-size: var(--fs-caption);
    line-height: 18px;
    color: var(--primary-1);
    background: var(--primary-5);
    border: 1px solid var(--primary-6);
    border-radius: 2px;
    padding: 0 7px;
    white-space: nowrap;
  }

  .bid-link {
    display: inline-flex;
    align-items: center;
    height: 34px;
    margin-top: 14px;
    padding: 0 16px;
    font-size: var(--fs-button);
    font-weight: var(--fw-bold);
    color: var(--primary-1);
    background: var(--background);
    border: 1.2px solid var(--primary-1);
    border-radius: var(--br-pill);
    text-decoration: none;
    transition: background .15s ease;
  }
  .bid-link:hover { background: var(--primary-5); }

  /* ============================================================
     입찰서류
     ============================================================ */

  /* 상태색 — 만료 빨강 / 임박 주황 / 정상 초록 / 없음 회색.
     흰 바탕에서 본문 대비 4.5:1 을 넘도록 톤을 낮춘 값들이다. */
  :root {
    --doc-expired:  #C4322C;
    --doc-imminent: #B45A15;
    --doc-normal:   var(--primary-1);
    --doc-none:     var(--grey-2);
  }

  .doc-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: var(--br-card);
    border: 1px solid var(--border);
    background: var(--grey-5);
    margin-bottom: var(--sp-element);
    font-size: var(--fs-h4);
  }
  .doc-summary.alert {
    border-color: rgba(196, 50, 44, .35);
    background: rgba(196, 50, 44, .06);
  }
  .doc-summary.ok {
    border-color: var(--primary-6);
    background: var(--primary-5);
  }

  .doc-summary-icon {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: var(--fw-bold);
    color: var(--primary-white);
  }
  .doc-summary.alert .doc-summary-icon { background: var(--doc-expired); }
  .doc-summary.ok .doc-summary-icon { background: var(--primary-1); }

  .doc-summary-text {
    font-weight: var(--fw-medium);
    color: var(--primary-black);
  }
  .doc-summary.ok .doc-summary-text { color: var(--primary-1); }

  .doc-chips {
    display: flex;
    gap: 8px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .doc-chip {
    font-family: inherit;
    font-size: var(--fs-p);
    padding: 5px 14px;
    border-radius: var(--br-pill);
    border: 1.2px solid currentColor;
    background: var(--background);
    cursor: pointer;
    transition: background .15s ease;
  }
  .doc-chip b { font-weight: var(--fw-bold); }
  .doc-chip.expired { color: var(--doc-expired); }
  .doc-chip.imminent { color: var(--doc-imminent); }
  .doc-chip:hover { background: var(--grey-5); }

  /* 상태 필터 세그먼트 */
  .seg-group {
    display: inline-flex;
    align-items: center;
    height: 40px;
    padding: 3px;
    gap: 2px;
    background: var(--grey-5);
    border: 1px solid var(--border);
    border-radius: var(--br-pill);
  }
  .seg-btn {
    height: 32px;
    padding: 0 14px;
    border: none;
    background: transparent;
    border-radius: var(--br-pill);
    font-size: var(--fs-p);
    color: var(--grey-2);
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .seg-btn:hover { color: var(--primary-black); }
  .seg-btn.active {
    background: var(--background);
    color: var(--primary-black);
    font-weight: var(--fw-bold);
    box-shadow: 0 1px 3px rgba(31, 36, 34, .12);
  }

  .ledger-row-main.doc-cols { grid-template-columns: 68px 1fr 150px 96px 24px; }

  .dday.doc-expired  { color: var(--doc-expired);  border-color: var(--doc-expired); }
  .dday.doc-imminent { color: var(--doc-imminent); border-color: var(--doc-imminent); background: var(--amber-5); }
  .dday.doc-normal   { color: var(--doc-normal);   border-color: var(--primary-4); }
  .dday.doc-none     { color: var(--doc-none);     border-color: var(--grey-4); background: var(--grey-5); }

  .doc-expiry {
    font-size: var(--fs-p);
    text-align: right;
    white-space: nowrap;
    color: var(--grey-2);
  }
  .doc-expiry b {
    font-family: var(--mono);
    font-weight: var(--fw-regular);
    color: var(--primary-black);
    font-variant-numeric: tabular-nums;
  }
  .doc-expiry span { margin-left: 4px; }

  .doc-badge {
    font-size: var(--fs-p);
    font-weight: var(--fw-bold);
    text-align: center;
    padding: 4px 0;
    border-radius: 2px;
    border: 1px solid currentColor;
  }
  .doc-badge.doc-expired  { color: var(--doc-expired); }
  .doc-badge.doc-imminent { color: var(--doc-imminent); }
  .doc-badge.doc-normal   { color: var(--doc-normal); }
  .doc-badge.doc-none     { color: var(--doc-none); border-color: var(--grey-3); }

  .doc-check {
    display: inline-flex;
    align-items: center;
    font-size: var(--fs-caption);
    line-height: 18px;
    color: var(--doc-imminent);
    border: 1px solid var(--amber-2);
    background: var(--amber-5);
    border-radius: 2px;
    padding: 0 7px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .ledger-main-text .task-name { cursor: inherit; }
  .doc-cols .ledger-main-text .task-name:hover { text-decoration: underline; }

  .doc-note {
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--grey-5);
    border-radius: var(--br-card-small);
    font-size: var(--fs-p);
    line-height: 1.7;
    color: var(--grey-2);
  }

  .doc-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .doc-download {
    display: inline-flex;
    align-items: center;
    height: 34px;
    margin-top: 14px;
    padding: 0 16px;
    font-size: var(--fs-button);
    color: var(--grey-2);
    background: var(--background);
    border: 1.2px solid var(--border);
    border-radius: var(--br-pill);
    text-decoration: none;
    transition: background .15s ease, border-color .15s ease;
  }
  .doc-download:hover { background: var(--grey-4); border-color: var(--border-active); }

  /* ============================================================
     버튼 (comp_lib Button)
     ============================================================ */
  .btn-primary, .btn-ghost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 18px;
    font-family: inherit;
    font-size: var(--fs-button);
    border-radius: var(--br-pill);
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn-primary {
    background: var(--primary-1);
    color: var(--primary-white);
    border: none;
    font-weight: var(--fw-bold);
  }
  .btn-primary:hover { background: #35604F; }
  .btn-ghost {
    background: var(--background);
    color: var(--primary-black);
    border: 1.2px solid var(--border);
    font-weight: var(--fw-regular);
  }
  .btn-ghost:hover { background: var(--grey-4); border-color: var(--border-active); }

  .bid-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .bid-actions .bid-link { margin-top: 0; }

  /* ============================================================
     제안자료 페이지
     ============================================================ */
  .propose-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .back-link {
    font-family: var(--mono);
    font-size: var(--fs-p);
    font-weight: var(--fw-bold);
    letter-spacing: .03em;
    color: var(--primary-1);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .back-link:hover { opacity: .65; }
  .propose-topbar .bid-link { margin-top: 0; margin-left: auto; }

  .propose-header { margin-bottom: var(--sp-element); }
  .propose-header h2 {
    margin: 0 0 8px;
    font-size: var(--fs-h2);
    line-height: 1.35;
    font-weight: var(--fw-bold);
    color: var(--primary-black);
  }
  .propose-meta {
    font-size: var(--fs-p);
    color: var(--grey-2);
  }

  .propose-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: var(--sp-element);
    align-items: start;
  }
  .propose-col { min-width: 0; }

  /* 하단 고정 선택/복사 바 */
  .propose-dock {
    position: sticky;
    bottom: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px var(--sp-page-padding);
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, .94);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
  }
  .propose-selected {
    font-size: var(--fs-p);
    color: var(--grey-2);
    padding-left: max(0px, calc((100% - 1240px) / 2));
  }
  .propose-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
    flex-wrap: wrap;
  }

  /* 공고문 원문 */
  .brief-toggle {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-p);
    color: var(--grey-2);
    cursor: pointer;
    white-space: nowrap;
  }
  .brief-toggle input { accent-color: var(--primary-1); }

  .brief-text {
    max-height: 460px;
    overflow-y: auto;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-size: var(--fs-p);
    line-height: 1.85;
    color: var(--grey-1);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .brief-text mark {
    background: rgba(251, 190, 81, .42);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ── 단계 카드 ── */
  .step-card {
    padding: 20px 22px;
    margin-bottom: var(--sp-element);
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--br-card);
  }
  .step-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .step-no {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--primary-1);
    color: var(--primary-white);
    font-size: var(--fs-caption);
    font-weight: var(--fw-bold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .step-head h3 {
    margin: 0;
    font-size: var(--fs-h4);
    font-weight: var(--fw-bold);
    color: var(--primary-black);
  }
  .step-hint {
    font-size: var(--fs-p);
    color: var(--grey-3);
    margin-left: auto;
  }

  .source-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
  }
  .source-box { min-width: 0; }
  .source-title {
    font-size: var(--fs-p);
    font-weight: var(--fw-bold);
    color: var(--primary-black);
    margin-bottom: 4px;
  }
  .source-desc {
    font-size: var(--fs-p);
    line-height: 1.6;
    color: var(--grey-2);
    margin-bottom: 10px;
  }

  /* 업로드 영역 */
  .upload-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 132px;
    padding: 18px;
    text-align: center;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    background: var(--grey-5);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .upload-zone:hover,
  .upload-zone.over {
    border-color: var(--primary-2);
    background: var(--primary-5);
  }
  .upload-icon {
    font-size: 20px;
    line-height: 1;
    color: var(--primary-2);
  }
  .upload-text {
    font-size: var(--fs-p);
    font-weight: var(--fw-medium);
    color: var(--primary-black);
  }
  .upload-sub {
    font-size: var(--fs-caption);
    color: var(--grey-3);
  }

  .upload-log { margin-top: 8px; }
  .upload-row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 5px 0;
    font-size: var(--fs-caption);
    border-bottom: 1px solid var(--border);
  }
  .upload-row:last-child { border-bottom: none; }
  .upload-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--primary-black);
  }
  .upload-msg { white-space: nowrap; color: var(--grey-2); }
  .upload-row.ok .upload-msg { color: var(--primary-1); }
  .upload-row.fail .upload-msg { color: var(--doc-expired); }

  /* 준비 상태 체크리스트 */
  .checklist {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: var(--br-card-small);
    border: 1px solid var(--border);
    background: var(--grey-5);
    font-size: var(--fs-p);
    line-height: 1.7;
    color: var(--grey-1);
  }
  .checklist.ok { background: var(--primary-5); border-color: var(--primary-6); }
  .checklist.warn { background: var(--amber-5); border-color: var(--amber-2); }

  .check-icon {
    flex: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: var(--fw-bold);
    color: var(--primary-white);
    background: var(--grey-3);
  }
  .check-icon.ok { background: var(--primary-1); }
  .check-icon.warn { background: var(--amber-1); }

  .check-pending {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  /* 분석 실행 */
  .analyze-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .analyze-status {
    font-size: var(--fs-p);
    color: var(--grey-2);
  }

  .same-field {
    display: inline-block;
    margin-left: 8px;
    font-size: var(--fs-caption);
    line-height: 18px;
    color: var(--primary-1);
    background: var(--primary-5);
    border: 1px solid var(--primary-6);
    border-radius: 2px;
    padding: 0 6px;
    vertical-align: middle;
  }
  .meets {
    display: inline-block;
    margin-left: 8px;
    font-size: var(--fs-caption);
    line-height: 18px;
    border-radius: 2px;
    padding: 0 6px;
    vertical-align: middle;
  }
  .meets.ok { color: var(--primary-1); background: var(--primary-5); border: 1px solid var(--primary-6); }
  .meets.no { color: var(--grey-2); background: var(--grey-5); border: 1px solid var(--border); }
  .pick-row.dim { opacity: .55; }

  /* 분야 판정 결과 */
  .field-verdict {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: var(--fs-p);
  }
  .verdict-label {
    font-size: var(--fs-caption);
    letter-spacing: .04em;
    color: var(--grey-3);
    text-transform: uppercase;
  }
  .verdict-field {
    font-size: var(--fs-h4);
    font-weight: var(--fw-bold);
    color: var(--primary-1);
    padding: 3px 12px;
    background: var(--primary-5);
    border: 1px solid var(--primary-6);
    border-radius: var(--br-pill);
  }
  .verdict-alt { color: var(--grey-2); }
  .verdict-none { color: var(--grey-2); }

  /* 필요 서식 목록 */
  .forms-list {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .form-row {
    display: grid;
    grid-template-columns: 68px 1fr auto;
    gap: 12px;
    align-items: start;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
  }
  .form-row:last-child { border-bottom: none; }
  .form-row.fillable { background: var(--primary-5); }

  .form-kind {
    font-size: var(--fs-caption);
    line-height: 20px;
    text-align: center;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--grey-2);
    background: var(--background);
  }
  .form-row.kind-perf .form-kind,
  .form-row.kind-hr .form-kind,
  .form-row.kind-company .form-kind {
    color: var(--primary-1);
    border-color: var(--primary-6);
  }
  .form-row.kind-holding .form-kind { color: var(--amber-1); border-color: var(--amber-2); }
  .form-row.kind-writing .form-kind { color: var(--grey-2); }

  .form-main { min-width: 0; }
  .form-name {
    display: block;
    font-size: var(--fs-h4);
    font-weight: var(--fw-medium);
    color: var(--primary-black);
    line-height: 1.4;
    word-break: break-all;
  }
  .form-name a { color: inherit; text-decoration: none; }
  .form-name a:hover { text-decoration: underline; }
  .from-brief {
    margin-left: 8px;
    font-size: var(--fs-caption);
    line-height: 18px;
    padding: 0 6px;
    color: var(--grey-2);
    background: var(--grey-5);
    border: 1px solid var(--border);
    border-radius: 2px;
    vertical-align: middle;
  }
  .form-reason {
    display: block;
    margin-top: 3px;
    font-size: var(--fs-p);
    color: var(--grey-2);
  }
  .form-flag {
    font-size: var(--fs-caption);
    white-space: nowrap;
    color: var(--grey-3);
  }
  .form-row.fillable .form-flag {
    color: var(--primary-1);
    font-weight: var(--fw-bold);
  }

  .forms-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .forms-actions .btn-primary,
  .forms-actions .btn-ghost { text-decoration: none; }

  .convert-note {
    width: 100%;
    padding: 12px 14px;
    background: var(--amber-5);
    border: 1px solid var(--amber-2);
    border-radius: var(--br-card-small);
    font-size: var(--fs-p);
    line-height: 1.7;
    color: var(--grey-1);
  }

  /* 생성 결과 */
  .gen-result {
    padding: 16px 18px;
    background: var(--primary-5);
    border-bottom: 1px solid var(--primary-6);
